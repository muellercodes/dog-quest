<canvas id="game"></canvas>
<div id="ui">
  <div id="touch" class="ui-hit">
    <button class="tb nav-skip" id="tbAtk" data-a="atk"><span class="ic">&#x1F43E;</span><span class="lb">Swing</span></button>
    <button class="tb small nav-skip" id="tbRoll" data-a="roll"><span class="lb">Roll</span></button>
    <button class="tb trick nav-skip" id="tbT1" data-a="t1"></button>
    <button class="tb trick nav-skip" id="tbT2" data-a="t2"></button>
    <button class="tb trick nav-skip" id="tbT3" data-a="t3"></button>
    <button class="tb trick nav-skip" id="tbT4" data-a="t4"></button>
  </div>
  <div id="topBtns" class="ui-hit">
    <button id="mapBtn" class="round nav-skip" aria-label="Map">&#x1F5FA;&#xFE0F;</button>
    <button id="menuBtn" class="round nav-skip" aria-label="Menu">&#9776;</button>
  </div>
  <div id="toasts"></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="dialog" class="hidden ui-hit">
    <div class="dbox">
      <canvas id="portrait" width="200" height="200"></canvas>
      <div class="dname"></div>
      <div class="dtext"></div>
      <div class="dchoices"></div>
      <div class="dnext">&#9660;</div>
    </div>
  </div>
  <div id="panel" class="hidden ui-hit"></div>
  <div id="screen" class="hidden ui-hit"></div>
  <div id="fade"><div class="ft"></div></div>
</div>
