<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b94dd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Dog Quest: an open-world action RPG starring a very good dog.">
<title>Dog Quest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffd84d'/%3E%3Cellipse cx='32' cy='40' rx='12' ry='10' fill='%233b2235'/%3E%3Ccircle cx='18' cy='28' r='5' fill='%233b2235'/%3E%3Ccircle cx='26' cy='19' r='5' fill='%233b2235'/%3E%3Ccircle cx='38' cy='19' r='5' fill='%233b2235'/%3E%3Ccircle cx='46' cy='28' r='5' fill='%233b2235'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --plum: #3b2235; --paper: #fff4dc; --paper2: #f6e2b8; --gold: #ffd84d; --red: #e8475f; --blue: #4f7fd9; --green: #5fb848; --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #3b94dd; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; font-family: Fredoka, ui-rounded, 'SF Pro Rounded', 'Trebuchet MS', system-ui, sans-serif; color: var(--plum); }
canvas#game { position: fixed; inset: 0; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.ui-hit, .ui-hit * { pointer-events: auto; }
.hidden { display: none !important; }
button { font-family: inherit; color: inherit; }

/* chunky storybook buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border: 3.5px solid var(--plum); border-radius: 16px; background: #fffaf0; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 0 var(--plum); transition: transform 0.06s, box-shadow 0.06s; position: relative; }
.btn:active, .btn.press { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum); }
.btn.gold { background: var(--gold); }
.btn.blue { background: #8fc0ff; }
.btn.green { background: #9be07a; }
.btn.red { background: #ff9aa6; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 15px; border-radius: 12px; box-shadow: 0 3px 0 var(--plum); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.focus { outline: 4px solid #4fb8e8 !important; outline-offset: 3px; }

/* panels */
.paper { background: var(--paper); border: 4px solid var(--plum); border-radius: 22px; box-shadow: 0 8px 0 rgba(59,34,53,0.35); }
.ribbon { display: inline-block; background: var(--red); color: #fff; border: 3.5px solid var(--plum); border-radius: 12px; padding: 4px 22px; font-weight: 700; font-size: 22px; letter-spacing: 0.5px; text-shadow: 0 2px 0 var(--plum); box-shadow: 0 4px 0 var(--plum); }

/* dialog */
#dialog { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; padding: 0 12px calc(14px + var(--sab)); }
.dbox { position: relative; width: min(860px, 100%); min-height: 150px; background: var(--paper); border: 4px solid var(--plum); border-radius: 22px; padding: 22px 26px 18px 168px; box-shadow: 0 8px 0 rgba(59,34,53,0.35); cursor: pointer; }
.dbox.noport { padding-left: 26px; }
#portrait { position: absolute; left: 16px; top: -34px; width: 136px; height: 136px; border-radius: 50%; background: #ffe6a8; border: 4px solid var(--plum); }
.dbox.noport #portrait { display: none; }
.dname { position: absolute; top: -20px; left: 170px; background: var(--gold); border: 3.5px solid var(--plum); border-radius: 12px; padding: 2px 14px; font-weight: 700; font-size: 18px; }
.dbox.noport .dname { left: 24px; }
.dname:empty { display: none; }
.dtext { font-size: 21px; line-height: 1.38; font-weight: 500; min-height: 58px; }
.dchoices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.dchoices:empty { display: none; }
.dnext { position: absolute; right: 18px; bottom: 8px; font-size: 18px; animation: bob 0.8s infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }

/* toasts and banners */
#toasts { position: absolute; left: 50%; top: calc(86px + var(--sat)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(560px, 92vw); }
.toast { background: rgba(255,250,240,0.96); border: 3px solid var(--plum); border-radius: 14px; padding: 6px 14px; font-size: 16px; font-weight: 600; box-shadow: 0 4px 0 rgba(59,34,53,0.3); animation: tin 0.25s ease-out; text-align: center; }
.toast.goal { background: #fff3b0; }
.toast.item, .toast.reward { background: #d9f5c9; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all 0.35s; }
@keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(0.95); } }
#banner { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none; }
#banner.on { animation: ban 2.4s ease-out; }
#banner .b1 { font-size: clamp(34px, 7vw, 64px); font-weight: 700; color: var(--gold); -webkit-text-stroke: 3px var(--plum); paint-order: stroke fill; text-shadow: 0 5px 0 var(--plum); letter-spacing: 1px; }
#banner .b2 { font-size: 22px; font-weight: 600; color: #fff; -webkit-text-stroke: 2px var(--plum); paint-order: stroke fill; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 20% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }

/* fade */
#fade { position: absolute; inset: 0; background: #2a1a2e; opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; }
#fade.on { opacity: 1; pointer-events: auto; }
#fade .ft { color: #fff; font-size: 26px; font-weight: 600; }

/* top buttons and touch controls */
#topBtns { position: absolute; top: calc(10px + var(--sat)); right: calc(10px + var(--sar)); display: flex; gap: 8px; }
.round { width: 50px; height: 50px; border-radius: 50%; border: 3.5px solid var(--plum); background: #fffaf0; font-size: 22px; box-shadow: 0 4px 0 var(--plum); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum); }
#touch { display: none; position: absolute; right: calc(16px + var(--sar)); bottom: calc(18px + var(--sab)); width: 250px; height: 250px; }
body.touchy #touch, body.touchon #touch { display: block; }
body.touchoff #touch { display: none !important; }
.tb { position: absolute; border-radius: 50%; border: 3.5px solid var(--plum); background: rgba(255,250,240,0.9); box-shadow: 0 4px 0 var(--plum); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; touch-action: none; padding: 0; }
.tb.down { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum); background: #fff3b0; }
#tbAtk { width: 96px; height: 96px; right: 6px; bottom: 6px; background: rgba(255,216,77,0.95); }
#tbAtk .ic { font-size: 30px; line-height: 1; }
#tbRoll { width: 62px; height: 62px; right: 112px; bottom: 4px; background: rgba(143,192,255,0.95); }
.tb.trick { width: 56px; height: 56px; font-size: 11px; overflow: hidden; }
.tb.trick canvas { width: 34px; height: 34px; }
.tb.trick .cd { position: absolute; inset: 0; background: rgba(59,34,53,0.45); border-radius: 50%; transform-origin: bottom; }
.tb.trick.empty { display: none; }
.tb.trick.poor { filter: grayscale(0.8); opacity: 0.7; }
#tbT1 { right: 124px; bottom: 82px; } #tbT2 { right: 92px; bottom: 146px; } #tbT3 { right: 28px; bottom: 170px; } #tbT4 { right: 180px; bottom: 132px; }

/* the big menu */
#panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(42,26,46,0.45); padding: calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal)); }
.menu { width: min(980px, 100%); height: min(680px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.mhead { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; flex-wrap: wrap; border-bottom: 3px dashed rgba(59,34,53,0.25); }
.mhead .gold { margin-left: auto; font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; }
.coin { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); border: 3px solid var(--plum); }
.tab { border: 3px solid var(--plum); border-radius: 12px; background: #fffaf0; padding: 6px 14px; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 3px 0 var(--plum); }
.tab.on { background: var(--gold); }
.mbody { flex: 1; overflow: auto; padding: 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.mfoot { padding: 10px 14px; display: flex; gap: 10px; justify-content: flex-end; border-top: 3px dashed rgba(59,34,53,0.25); flex-wrap: wrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: #fffaf0; border: 3px solid var(--plum); border-radius: 16px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; box-shadow: 0 3px 0 rgba(59,34,53,0.4); position: relative; }
.card.on { background: #fff3b0; }
.card.dim { opacity: 0.55; }
.card canvas { flex: none; width: 56px; height: 56px; background: #ffe6a8; border-radius: 12px; border: 2.5px solid var(--plum); }
.card .t1 { font-weight: 700; font-size: 17px; }
.card .t2 { font-size: 14px; opacity: 0.85; }
.card .tag { position: absolute; top: -10px; right: 10px; background: var(--green); color: #fff; border: 2.5px solid var(--plum); border-radius: 8px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
.st { background: #fff; border: 2.5px solid var(--plum); border-radius: 10px; padding: 2px 9px; font-weight: 700; font-size: 14px; }
.st.up { background: #d9f5c9; } .st.down { background: #ffd6dc; }
.split { display: flex; gap: 14px; height: 100%; }
.split > .left { flex: none; width: 270px; display: flex; flex-direction: column; gap: 10px; }
.split > .right { flex: 1; min-width: 0; }
@media (max-width: 720px) { .split { flex-direction: column; height: auto; } .split > .left { width: 100%; } .grid { grid-template-columns: 1fr; } .dbox { padding-left: 120px; } #portrait { width: 100px; height: 100px; left: 10px; top: -26px; } .dname { left: 118px; } .dtext { font-size: 18px; } }
h3 { margin: 4px 0 10px; font-size: 20px; }
p { margin: 6px 0; font-size: 16px; line-height: 1.4; }
.qrow { padding: 10px 12px; border: 3px solid var(--plum); border-radius: 14px; background: #fffaf0; margin-bottom: 10px; cursor: pointer; }
.qrow.on { background: #fff3b0; }
.qrow .t1 { font-weight: 700; font-size: 17px; } .qrow .t2 { font-size: 15px; }
.row { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
.row label { min-width: 120px; font-weight: 600; }
input[type=range] { width: 200px; accent-color: #e8475f; }
input[type=text], input[type=password] { font-family: inherit; font-size: 18px; padding: 8px 12px; border: 3px solid var(--plum); border-radius: 12px; background: #fff; color: var(--plum); width: min(320px, 100%); }
.mapwrap { position: relative; width: 100%; height: 100%; min-height: 300px; }
.mapwrap canvas { width: 100%; height: 100%; display: block; border-radius: 14px; border: 3px solid var(--plum); background: #3b94dd; }
.err { color: #c0283c; font-weight: 600; }
.ok { color: #2f8a3a; font-weight: 600; }

/* title and other full screens */
#screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: calc(16px + var(--sat)) 16px calc(16px + var(--sab)); }
.title { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo { font-size: clamp(56px, 12vw, 120px); font-weight: 700; color: var(--gold); -webkit-text-stroke: 5px var(--plum); paint-order: stroke fill; text-shadow: 0 8px 0 var(--plum); line-height: 0.95; letter-spacing: 2px; }
.logo small { display: block; font-size: 0.32em; color: #fff; -webkit-text-stroke: 3px var(--plum); letter-spacing: 1px; margin-top: 8px; text-shadow: 0 4px 0 var(--plum); }
.title .btns { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; min-width: 260px; }
.foot { position: absolute; bottom: calc(8px + var(--sab)); left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
.who { position: absolute; top: calc(12px + var(--sat)); left: 14px; color: #fff; font-weight: 600; text-shadow: 0 2px 0 var(--plum); }
.newgame { width: min(900px, 100%); max-height: 100%; overflow: auto; padding: 18px; }
.breeds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 640px) { .breeds { grid-template-columns: repeat(2, 1fr); } }
.breed { border: 3px solid var(--plum); border-radius: 16px; background: #fffaf0; padding: 6px; text-align: center; cursor: pointer; font-weight: 700; box-shadow: 0 3px 0 rgba(59,34,53,0.4); }
.breed.on { background: #fff3b0; }
.breed canvas { width: 100%; height: 92px; display: block; }
.story { width: min(760px, 100%); padding: 30px 32px; font-size: clamp(20px, 3vw, 27px); line-height: 1.45; text-align: center; font-weight: 500; }
.story .btns { margin-top: 22px; display: flex; gap: 12px; justify-content: center; }
.hint { font-size: 14px; opacity: 0.8; }

body:not([data-state="play"]) #topBtns, body:not([data-state="play"]) #touch { display: none !important; }
@media (max-width: 1100px) { #toasts { top: calc(150px + var(--sat)); } }
@media (max-height: 460px) { #toasts { top: calc(118px + var(--sat)); width: min(460px, 60vw); } .toast { font-size: 14px; padding: 4px 10px; } }

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div id="touch" class="ui-hit">
    <button class="tb nav-skip" id="tbAtk" data-a="atk"><span class="ic">&#x1F43E;</span><span class="lb">Swing</span></button>
    <button class="tb small nav-skip" id="tbRoll" data-a="roll"><span class="lb">Roll</span></button>
    <button class="tb trick nav-skip" id="tbT1" data-a="t1"></button>
    <button class="tb trick nav-skip" id="tbT2" data-a="t2"></button>
    <button class="tb trick nav-skip" id="tbT3" data-a="t3"></button>
    <button class="tb trick nav-skip" id="tbT4" data-a="t4"></button>
  </div>
  <div id="topBtns" class="ui-hit">
    <button id="mapBtn" class="round nav-skip" aria-label="Map">&#x1F5FA;&#xFE0F;</button>
    <button id="menuBtn" class="round nav-skip" aria-label="Menu">&#9776;</button>
  </div>
  <div id="toasts"></div>
  <div id="banner"><div class="b1"></div><div class="b2"></div></div>
  <div id="dialog" class="hidden ui-hit">
    <div class="dbox">
      <canvas id="portrait" width="200" height="200"></canvas>
      <div class="dname"></div>
      <div class="dtext"></div>
      <div class="dchoices"></div>
      <div class="dnext">&#9660;</div>
    </div>
  </div>
  <div id="panel" class="hidden ui-hit"></div>
  <div id="screen" class="hidden ui-hit"></div>
  <div id="fade"><div class="ft"></div></div>
</div>
<script>
'use strict';
const VERSION = '0.1.0';
// ---- 00_core.js
// Core helpers shared by everything: math, noise, random, storage, the canvas.
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const dist2 = (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
const angTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const ease = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const fmt = (n) => String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// integer hash to [0,1)
function hash2(x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 2147483647;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct, s) {
  let v = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { v += amp * vnoise(x * f, y * f, s + i * 17); n += amp; amp *= 0.5; f *= 2.03; }
  return v / n;
}

// colours
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }
function shade(h, k) { const [r, g, b] = hexRgb(h); return k < 0 ? rgbHex(r * (1 + k), g * (1 + k), b * (1 + k)) : rgbHex(r + (255 - r) * k, g + (255 - g) * k, b + (255 - b) * k); }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return rgbHex(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)); }
const OUT = '#3b2235';       // the warm plum outline around everything
const OUTW = 2.6;

// storage that never throws
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// the canvas
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let SW = 0, SH = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SW = window.innerWidth; SH = window.innerHeight;
  cv.width = Math.round(SW * DPR); cv.height = Math.round(SH * DPR);
  cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
}
window.addEventListener('resize', resize);
resize();

// offscreen canvas helper
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

// rounded rect path
function rrect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
// fill + outline the current path
function fo(c, fill, lw) { c.fillStyle = fill; c.fill(); c.lineWidth = lw || OUTW; c.strokeStyle = OUT; c.stroke(); }
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); }

// tiny event hub
const Bus = { h: {}, on(e, f) { (this.h[e] = this.h[e] || []).push(f); }, emit(e, a) { (this.h[e] || []).forEach((f) => { try { f(a); } catch (err) { console.error(err); } }); } };

// everything a test page might want to poke at
const DQ = (window.__dq = {});

// ---- 01_audio.js
// Sound: every effect and every tune is made on the fly, so there are no audio files.
const Audio_ = { ctx: null, sfx: null, mus: null };
function audioInit() {
  if (Audio_.ctx) { if (Audio_.ctx.state === 'suspended') Audio_.ctx.resume(); return; }
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();

const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], harm: [0, 1, 4, 5, 7, 8, 10] };
const TRACKS = {
  title: { root: 60, scale: 'major', bpm: 92, prog: [0, 4, 5, 3], lead: 'triangle', seed: 3 },
  field: { root: 67, scale: 'major', bpm: 104, prog: [0, 3, 0, 4, 5, 3, 4, 4], lead: 'triangle', seed: 7 },
  town: { root: 65, scale: 'major', bpm: 96, prog: [0, 5, 3, 4], lead: 'square', seed: 11, walk: 1 },
  forest: { root: 62, scale: 'dorian', bpm: 90, prog: [0, 6, 3, 0], lead: 'triangle', seed: 13 },
  coast: { root: 64, scale: 'major', bpm: 108, prog: [0, 4, 5, 4], lead: 'square', seed: 17 },
  snow: { root: 57, scale: 'minor', bpm: 78, prog: [0, 5, 2, 6], lead: 'sine', seed: 19, bell: 1 },
  desert: { root: 64, scale: 'harm', bpm: 96, prog: [0, 1, 0, 6], lead: 'square', seed: 23 },
  spooky: { root: 62, scale: 'minor', bpm: 74, prog: [0, 5, 3, 4], lead: 'sine', seed: 29, bell: 1 },
  isle: { root: 59, scale: 'minor', bpm: 100, prog: [0, 5, 6, 4], lead: 'square', seed: 31 },
  dungeon: { root: 57, scale: 'minor', bpm: 108, prog: [0, 5, 3, 4], lead: 'square', seed: 37, drums: 1 },
  cave: { root: 64, scale: 'minor', bpm: 92, prog: [0, 3, 0, 4], lead: 'triangle', seed: 41, drums: 1 },
  boss: { root: 62, scale: 'minor', bpm: 144, prog: [0, 5, 6, 4], lead: 'sawtooth', seed: 43, drums: 2 },
  ending: { root: 60, scale: 'major', bpm: 84, prog: [0, 3, 4, 0, 5, 3, 4, 4], lead: 'triangle', seed: 47 },

const Music = { cur: null, want: null, timer: null, step: 0, next: 0 };
Music.play = function (name) {
  this.want = name;
  if (!Audio_.ctx) return;
  if (this.cur === name) return;
  this.cur = name;
  const T = TRACKS[name]; if (!T) return;
  // write the tune for this place: 8 bars of eighth notes
  const rng = mulberry32(T.seed), sc = SCALES[T.scale];
  const deg = (d) => T.root + sc[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);

  for (let b = 0; b < bars; b++) {
    const ch = T.prog[b % T.prog.length];
    for (let s = 0; s < 8; s++) {
      const r = rng();
      if (s > 0 && r < 0.28) { mel.push(null); continue; }
      const chordTone = [ch, ch + 2, ch + 4][Math.floor(rng() * 3)] + 7;

  const { T, mel, deg, bars } = this.song, e = 60 / T.bpm / 2;

    const t = this.next, s = this.step % (bars * 8), bar = Math.floor(s / 8), beat = s % 8;

// Input: keyboard, gamepad and touch all feed the same actions.
const ACTIONS = ['atk', 'roll', 't1', 't2', 't3', 't4', 'act', 'menu', 'map', 'up', 'down', 'left', 'right', 'lb', 'rb', 'back'];

Input.update = function () {
  // gamepad
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const p = pads && Array.from(pads).find((g) => g && g.connected);
  this.pad = {};
  let px = 0, py = 0;
  if (p) {
    const b = (i) => p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5);
    const map = { 0: 'atk', 1: 'roll', 2: 't1', 3: 't2', 4: 't3', 5: 't4', 9: 'menu', 8: 'map', 12: 'up', 13: 'down', 14: 'left', 15: 'right', 6: 'lb', 7: 'rb' };

  this.prev = this.down; this.down = {};

  this.hit = {};
  for (const a of ACTIONS) this.hit[a] = (this.down[a] && !this.prev[a]) || !!this.queued[a];
  this.queued = {};

  const nx = px, ny = py;
  this.navRepeat -= 1 / 60;

  grotto: { x: 8830, y: 3190, art: 'grotto' },
  den: { x: 4640, y: 640, art: 'icecave' },
  purramid: { x: 5750, y: 5880, art: 'purramid' },
  keep: { x: 8640, y: 5980, art: 'keep' },
  b_bunny: { x: 2600, y: 4850, art: 'burrow' },
  b_mole: { x: 900, y: 3050, art: 'burrow' },
  b_kennel: { x: 3420, y: 2650, art: 'kennel' },
  b_crab: { x: 7850, y: 4550, art: 'burrow' },
  b_ice: { x: 3500, y: 950, art: 'icecave' },
  b_haunt: { x: 7750, y: 1150, art: 'kennel' },

// roads: lists of points (town keys or [x,y])
const ROADS = [
  ['waggington', [2600, 4150], [3400, 3720], 'barkingham'],
  ['barkingham', [5200, 3520], [6300, 3660], 'fetchwick'],
  ['barkingham', [4250, 2700], 'frostpaw', [4420, 1500], [4560, 860]],
  ['barkingham', [4180, 4200], [4120, 4750], 'dunehound', [5000, 5620], [5650, 5800]],
  ['waggington', [1650, 3650], [1800, 3100], 'camp', [1500, 2150], [1250, 1930]],
  ['fetchwick', [7450, 2800], [7150, 2100], 'howlow'],
  ['waggington', [2350, 4700], [2600, 4800]],
];

const World = {
  F: null, BI: null, CR: null, CG: null, CB: null, TW: null,
  props: [], grid: [], decor: [], dgrid: [], coast: [], roadPolys: [], plazas: [],
  ready: false,
};

function blobF(x, y) {
  let f = -9;
  for (const b of BLOBS) {
    const dx = (x - b.x) / b.rx, dy = (y - b.y) / b.ry;
    const d = Math.sqrt(dx * dx + dy * dy);
    const v = (1 - d) * Math.min(b.rx, b.ry) / 600;
    if (v > f) f = v;
  }
  return f;
}
function rawF(x, y) {
  let f = blobF(x, y);
  f += (fbm(x / 950, y / 950, 3, 11) - 0.5) * 0.62 + (fbm(x / 230, y / 230, 2, 23) - 0.5) * 0.13;
  for (const l of LAKES) {
    const dx = (x - l.x) / l.rx, dy = (y - l.y) / l.ry;
    const d = Math.sqrt(dx * dx + dy * dy) + (vnoise(x / 120, y / 120, 31) - 0.5) * 0.25;
    f = Math.min(f, (d - 1) * Math.min(l.rx, l.ry) / 600);
  }
  // the world's edge is always sea
  f = Math.min(f, (Math.min(x, WW - x, y, WH - y) - 120) / 600);
  return f;
}

// which biome a point belongs to, plus the next one and how close to the border
function biomeRaw(x, y) {
  const idx = (x - ISLE.x) / ISLE.rx, idy = (y - ISLE.y) / ISLE.ry;
  if (idx * idx + idy * idy < 2.6) return { a: 'isle', b: 'isle', t: 1 };
  const wx = x + (fbm(x / 800, y / 800, 2, 5) - 0.5) * 900, wy = y + (fbm(x / 800, y / 800, 2, 9) - 0.5) * 900;
  let d1 = 1e12, d2 = 1e12, a = null, b = null;
  for (const r of REGIONS) {
    const d = dist(wx, wy, r.x, r.y) * (r.id === 'plains' ? 0.85 : 1);
    if (d < d1) { d2 = d1; b = a; d1 = d; a = r.id; } else if (d < d2) { d2 = d; b = r.id; }
  }
  return { a, b, t: clamp((d2 - d1) / 260, 0, 1) };
}

World.init = function () {
  const t0 = performance.now();
  const n = GW * GH;
  const F = (this.F = new Float32Array(n));
  const BI = (this.BI = new Uint8Array(n));
  const CR = (this.CR = new Uint8Array(n)), CG = (this.CG = new Uint8Array(n)), CB = (this.CB = new Uint8Array(n));
  const M = (this.M = new Float32Array(n));
  const rgbs = {};
  for (const id of BIOME_IDS) rgbs[id] = { g: hexRgb(BIOMES[id].g), g2: hexRgb(BIOMES[id].g2) };
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const x = i * GS, y = j * GS, k = j * GW + i;
    F[k] = rawF(x, y);
    const bm = biomeRaw(x, y);
    BI[k] = BIOME_IDS.indexOf(bm.a);
    const m = fbm(x / 340, y / 340, 2, 77);
    M[k] = m;
    const ca = rgbs[bm.a], cb = rgbs[bm.b];
    const mt = clamp((m - 0.35) * 2.2, 0, 1);
    const w = 0.5 + 0.5 * bm.t;
    for (let c = 0; c < 3; c++) {
      const va = lerp(ca.g[c], ca.g2[c], mt), vb = lerp(cb.g[c], cb.g2[c], mt);
      const v = lerp(vb, va, w);
      (c === 0 ? CR : c === 1 ? CG : CB)[k] = v;
    }
  }
  // nudge towns and dungeon spots onto solid land
  for (const id in TOWNS) { const t = TOWNS[id]; const p = this.toLand(t.x, t.y, 0.25); t.x = p.x; t.y = p.y; }
  for (const id in DUNGEON_SPOTS) { const t = DUNGEON_SPOTS[id]; const p = this.toLand(t.x, t.y, 0.12); t.x = p.x; t.y = p.y; }
  this.buildRoads();
  this.buildCoast();
  this.buildProps();
  this.buildTowns();
  this.ready = true;
  this.initMs = performance.now() - t0;
};

World.Fat = function (x, y) {
  const gx = clamp(x / GS, 0, GW - 1.001), gy = clamp(y / GS, 0, GH - 1.001);
  const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * GW + i, F = this.F;
  const a = F[k], b = F[k + 1], c = F[k + GW], d = F[k + GW + 1];
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
};
World.biomeAt = function (x, y) {
  const i = clamp(Math.round(x / GS), 0, GW - 1), j = clamp(Math.round(y / GS), 0, GH - 1);
  return BIOME_IDS[this.BI[j * GW + i]];
};
World.regionAt = function (x, y) {
  const b = this.biomeAt(x, y);
  return b === 'isle' ? ISLE : REGIONS.find((r) => r.id === b);
};
World.toLand = function (x, y, minF) {
  if (this.Fat(x, y) > minF) return { x, y };
  for (let r = 24; r < 1200; r += 24) for (let a = 0; a < 24; a++) {
    const px = x + Math.cos((a / 24) * TAU) * r, py = y + Math.sin((a / 24) * TAU) * r;
    if (this.Fat(px, py) > minF) return { x: px, y: py };
  }
  return { x, y };
};
World.townAt = function (x, y) {
  for (const id in TOWNS) { const t = TOWNS[id]; if (dist2(x, y, t.x, t.y) < t.r * t.r) return id; }
  return null;
};

// ---------- roads (drawn as crisp strokes every frame) and town plazas
World.buildRoads = function () {
  const pt = (p) => (typeof p === 'string' ? [TOWNS[p].x, TOWNS[p].y] : p);
  this.roadSegs = [];
  this.roadPolys = ROADS.map((r, ri) => {
    const pts = r.map(pt), out = [];
    for (let s = 0; s < pts.length - 1; s++) {
      const [ax, ay] = pts[s], [bx, by] = pts[s + 1];
      const len = dist(ax, ay, bx, by), steps = Math.max(2, Math.round(len / 70));
      const nx = -(by - ay) / len, ny = (bx - ax) / len;
      for (let k = 0; k < steps; k++) {
        const t = k / steps, w = (vnoise(ri * 50 + s * 9 + t * len / 300, 3, 41) - 0.5) * 110 * Math.sin(t * Math.PI);
        out.push([ax + (bx - ax) * t + nx * w, ay + (by - ay) * t + ny * w]);
      }
    }
    out.push(pts[pts.length - 1]);
    for (let k = 0; k < out.length - 1; k++) this.roadSegs.push([out[k][0], out[k][1], out[k + 1][0], out[k + 1][1]]);
    return out;
  });
  this.plazas = Object.keys(TOWNS).map((id) => {
    const t = TOWNS[id], pts = [], R = t.r * 0.62;
    for (let a = 0; a < 28; a++) { const ang = (a / 28) * TAU, rr = R * (0.86 + 0.28 * vnoise(Math.cos(ang) * 2 + 5, Math.sin(ang) * 2 + id.length, 61)); pts.push([t.x + Math.cos(ang) * rr, t.y + Math.sin(ang) * rr * 0.8]); }
    return { id, pts, x: t.x, y: t.y, r: R };
  });
};
World.roadDist = function (x, y) {
  let best = 1e9;
  for (const s of this.roadSegs) {
    const [ax, ay, bx, by] = s, dx = bx - ax, dy = by - ay;
    const t = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
    const d = dist2(x, y, ax + dx * t, ay + dy * t);
    if (d < best) best = d;
  }
  return Math.sqrt(best);
};

// ---------- coast lines by marching squares (shore, foam, outer foam), stored in a grid for culling
World.buildCoast = function () {
  const levels = [0, -0.045, -0.12];
  this.coast = levels.map(() => { const g = []; for (let i = 0; i < PCW * PCH; i++) g.push([]); return g; });
  const F = this.F;
  for (let j = 0; j < GH - 1; j++) for (let i = 0; i < GW - 1; i++) {
    const k = j * GW + i;
    const a = F[k], b = F[k + 1], c = F[k + GW + 1], d = F[k + GW];
    levels.forEach((L, li) => {
      const ca = a > L, cb = b > L, cc = c > L, cd = d > L;
      const idx = (ca ? 8 : 0) | (cb ? 4 : 0) | (cc ? 2 : 0) | (cd ? 1 : 0);
      if (idx === 0 || idx === 15) return;
      const x = i * GS, y = j * GS;
      const ip = (v1, v2) => (L - v1) / (v2 - v1 || 1e-6);
      const top = [x + GS * ip(a, b), y], right = [x + GS, y + GS * ip(b, c)], bottom = [x + GS * ip(d, c), y + GS], left = [x, y + GS * ip(a, d)];
      const segs = [];
      switch (idx) {
        case 1: case 14: segs.push([left, bottom]); break;
        case 2: case 13: segs.push([bottom, right]); break;
        case 3: case 12: segs.push([left, right]); break;
        case 4: case 11: segs.push([top, right]); break;
        case 6: case 9: segs.push([top, bottom]); break;
        case 7: case 8: segs.push([left, top]); break;
        case 5: segs.push([left, top], [bottom, right]); break;
        case 10: segs.push([top, right], [left, bottom]); break;
      }
      const cell = Math.floor(y / PC) * PCW + Math.floor(x / PC);
      for (const s of segs) this.coast[li][cell].push(s[0][0], s[0][1], s[1][0], s[1][1]);
    });
  }
};

// ---------- scenery props
// kinds: tree, pine, palm, dead, bush, rock, srock, cactus, mountain, mushroom, pumpkin, yarn, post, bones, log, snowman, stump
// decor (flat, no collision): tuft, flower, pebble, shell, drift, fern
function propAt(kind, x, y, opts) {
  const p = Object.assign({ kind, x, y, v: 0, s: 1, r: 0 }, opts || {});
  if (!p.r) p.r = PROP_R[kind] || 0;
  return p;
}
const PROP_R = { tree: 20, pine: 18, palm: 14, dead: 14, bush: 16, rock: 20, srock: 20, cactus: 13, mountain: 95, mushroom: 0, pumpkin: 12, yarn: 14, post: 12, bones: 0, log: 18, snowman: 14, stump: 14, crystal: 14, lamp: 6 };

World.addProp = function (p) {
  this.props.push(p);
  const cx = clamp(Math.floor(p.x / PC), 0, PCW - 1), cy = clamp(Math.floor(p.y / PC), 0, PCH - 1);
  this.grid[cy * PCW + cx].push(p);
  return p;
};
World.addDecor = function (d) {
  const cx = clamp(Math.floor(d.x / PC), 0, PCW - 1), cy = clamp(Math.floor(d.y / PC), 0, PCH - 1);
  this.dgrid[cy * PCW + cx].push(d);
};
World.clearSpot = function (x, y, r) {
  for (const t of Object.values(TOWNS)) if (dist(x, y, t.x, t.y) < t.r + r) return false;
  for (const t of Object.values(DUNGEON_SPOTS)) if (dist(x, y, t.x, t.y) < 170 + r) return false;
  if (this.roadDist(x, y) < 52 + r) return false;
  return true;
};
World.buildProps = function () {
  this.grid = []; this.dgrid = []; this.props = [];
  for (let i = 0; i < PCW * PCH; i++) { this.grid.push([]); this.dgrid.push([]); }
  const rng = mulberry32(2026);
  const C = 56;
  for (let cy = 0; cy < WH / C; cy++) for (let cx = 0; cx < WW / C; cx++) {
    const x = cx * C + rng() * C, y = cy * C + rng() * C;
    const f = this.Fat(x, y);
    const r1 = rng(), r2 = rng();
    if (f < 0.035) {
      if (f > 0.005 && r1 < 0.06) { const b = this.biomeAt(x, y); if (b === 'coast' || b === 'meadow' || b === 'isle') this.addDecor({ kind: 'shell', x, y, v: (r2 * 3) | 0 }); }
      continue;
    }
    const b = this.biomeAt(x, y);
    const m = fbm(x / 500, y / 500, 2, 91);       // clumping: woods grow in patches
    const open = this.clearSpot(x, y, 10);
    // flat decor first
    if (r2 < 0.5) {
      const dk = { meadow: ['tuft', 'flower', 'flower'], forest: ['tuft', 'fern', 'fern'], plains: ['tuft', 'flower', 'tuft'], coast: ['tuft', 'tuft', 'shell'],
        snow: ['drift', 'drift', 'pebble'], desert: ['pebble', 'pebble', 'tuft'], spooky: ['tuft', 'fern', 'pebble'], isle: ['tuft', 'pebble', 'flower'] }[b];
      this.addDecor({ kind: dk[(r2 * 6) | 0 % 3] || dk[0], x: x + rng() * 30 - 15, y: y + rng() * 30 - 15, v: (rng() * 4) | 0, b });
    }
    if (!open) continue;
    let kind = null;
    const dens = clamp((m - 0.38) * 2.4, 0, 1);
    switch (b) {
      case 'meadow': if (r1 < 0.04 + dens * 0.2) kind = 'tree'; else if (r1 < 0.27) kind = r2 < 0.3 ? 'bush' : null; else if (r1 < 0.29) kind = 'rock'; break;
      case 'forest': if (r1 < 0.16 + dens * 0.4) kind = r2 < 0.18 ? 'pine' : 'tree'; else if (r1 < 0.58) kind = r2 < 0.2 ? 'bush' : r2 < 0.3 ? 'mushroom' : r2 < 0.33 ? 'log' : null; break;
      case 'plains': if (r1 < 0.03 + dens * 0.1) kind = 'tree'; else if (r1 < 0.2) kind = r2 < 0.22 ? 'bush' : r2 < 0.3 ? 'rock' : null; break;
      case 'coast': if (r1 < 0.04 + dens * 0.08) kind = r2 < 0.55 ? 'palm' : 'tree'; else if (r1 < 0.16) kind = r2 < 0.25 ? 'rock' : r2 < 0.4 ? 'bush' : null; break;
      case 'snow': if (r1 < 0.08 + dens * 0.18) kind = 'pine'; else if (r1 < 0.26) kind = r2 < 0.25 ? 'srock' : r2 < 0.3 ? 'snowman' : r2 < 0.34 ? 'crystal' : null; break;
      case 'desert': if (r1 < 0.05) kind = 'cactus'; else if (r1 < 0.14) kind = r2 < 0.35 ? 'rock' : r2 < 0.6 ? 'bones' : null; break;
      case 'spooky': if (r1 < 0.1 + dens * 0.15) kind = r2 < 0.6 ? 'dead' : 'pine'; else if (r1 < 0.34) kind = r2 < 0.3 ? 'mushroom' : r2 < 0.45 ? 'pumpkin' : r2 < 0.55 ? 'stump' : null; break;
      case 'isle': if (r1 < 0.05 + dens * 0.06) kind = r2 < 0.5 ? 'post' : 'tree'; else if (r1 < 0.2) kind = r2 < 0.3 ? 'yarn' : r2 < 0.45 ? 'rock' : r2 < 0.55 ? 'bones' : null; break;
    }
    if (kind) {
      const big = kind === 'tree' || kind === 'pine' || kind === 'palm' || kind === 'dead';
      this.addProp(propAt(kind, x, y, { v: (rng() * 4) | 0, s: big ? 1.1 + rng() * 0.45 : 0.85 + rng() * 0.35 }));
    }
  }
  // the mountains of Barkmore: a range across the high north, leaving the road, the towns and the caves clear
  for (let y = 100; y < 1750; y += 125) for (let x = 2500; x < 6600; x += 150) {
    const px = x + (rng() - 0.5) * 110 + ((y / 125) % 2) * 70, py = y + (rng() - 0.5) * 80;
    const f = this.Fat(px, py);
    if (f < 0.16 || this.biomeAt(px, py) !== 'snow') continue;
    if (this.roadDist(px, py) < 200 || !this.clearSpot(px, py, 150)) continue;
    if (vnoise(px / 380, py / 380, 13) < 0.3 + Math.max(0, py - 600) / 3000) continue;
    if (dist(px, py, LAKES[1].x, LAKES[1].y) < 430) continue;
    if (this.grid[Math.floor(py / PC) * PCW + Math.floor(px / PC)].some((q) => q.kind === 'mountain' && dist(q.x, q.y, px, py) < 160)) continue;
    this.addProp(propAt('mountain', px, py, { v: (rng() * 3) | 0, s: 0.75 + rng() * 0.45 }));
  }
  // clear small scenery out from under the mountains
  for (const g of this.grid) for (let i = g.length - 1; i >= 0; i--) { const q = g[i]; if (q.kind === 'mountain') continue; if (this.props.some((m) => m.kind === 'mountain' && Math.abs(m.x - q.x) < 110 * m.s && q.y < m.y + 10 && q.y > m.y - 150 * m.s)) { g.splice(i, 1); q.gone = true; } }
  this.props = this.props.filter((q) => !q.gone);
};

// is the spot blocked for a body of radius r? swim: shallow water is fine
World.blocked = function (x, y, r, swim) {
  const f = this.Fat(x, y);
  if (f < 0.012) {
    if (!swim) return true;
    if (f < -0.45) return true;
    if (!G.flags.ferry && dist2(x, y, ISLE.x, ISLE.y) < 1500 * 1500 && this.biomeAt(x, y) !== 'isle') return true;
  }
  const cx0 = Math.floor((x - 220) / PC), cx1 = Math.floor((x + 220) / PC), cy0 = Math.floor((y - 220) / PC), cy1 = Math.floor((y + 220) / PC);
  for (let cy = Math.max(0, cy0); cy <= Math.min(PCH - 1, cy1); cy++) for (let cx = Math.max(0, cx0); cx <= Math.min(PCW - 1, cx1); cx++) {
    for (const p of this.grid[cy * PCW + cx]) {
      if (p.box) { const b = p.box; if (x + r > b[0] && x - r < b[0] + b[2] && y + r > b[1] && y - r < b[1] + b[3]) return true; continue; }
      if (!p.r || p.gone) continue;
      const rr = p.r * (p.s || 1) + r;
      if (dist2(x, y, p.x, p.y) < rr * rr) return true;
    }
  }
  return false;
};
World.inWater = function (x, y) { return this.Fat(x, y) < 0.012; };
World.propsIn = function (x0, y0, x1, y1, out) {
  for (let cy = Math.max(0, Math.floor(y0 / PC)); cy <= Math.min(PCH - 1, Math.floor(y1 / PC)); cy++)
    for (let cx = Math.max(0, Math.floor(x0 / PC)); cx <= Math.min(PCW - 1, Math.floor(x1 / PC)); cx++) for (const p of this.grid[cy * PCW + cx]) out.push(p);
  return out;
};

// ---- 04_ground.js
// Ground: soft colour fields baked into chunks, with crisp coastlines, foam, plazas and roads drawn as vectors on top.
const CHW = 512, CHS = 0.5, CHP = CHW * CHS;   // chunk world size, scale, pixel size
const Ground = { cache: new Map(), queue: [], frame: 0 };

const WATER = { edge: hexRgb('#a8ecf2'), shallow: hexRgb('#5fc8ec'), deep: hexRgb('#3b94dd') };
const SANDS = {};
for (const id of BIOME_IDS) SANDS[id] = hexRgb(BIOMES[id].sand);

Ground.render = function (cx, cy) {
  const c = mkCanvas(CHP, CHP), g = c.getContext('2d');
  const img = g.createImageData(CHP, CHP), d = img.data;
  const x0 = cx * CHW, y0 = cy * CHW, step = 1 / CHS;
  const F = World.F, CR = World.CR, CG = World.CG, CB = World.CB, BI = World.BI;
  for (let py = 0; py < CHP; py++) {
    const wy = y0 + (py + 0.5) * step;
    const gy = clamp(wy / GS, 0, GH - 1.001), j = gy | 0, fy = gy - j;
    for (let px = 0; px < CHP; px++) {
      const wx = x0 + (px + 0.5) * step;
      const gx = clamp(wx / GS, 0, GW - 1.001), i = gx | 0, fx = gx - i;
      const k = j * GW + i, k2 = k + 1, k3 = k + GW, k4 = k + GW + 1;
      const w1 = (1 - fx) * (1 - fy), w2 = fx * (1 - fy), w3 = (1 - fx) * fy, w4 = fx * fy;
      const f = F[k] * w1 + F[k2] * w2 + F[k3] * w3 + F[k4] * w4;
      let r, gg, b;
      const o = (py * CHP + px) * 4;
      if (f < 0) {
        const t = clamp(-f / 0.55, 0, 1);
        const A = t < 0.22 ? WATER.edge : WATER.shallow, B = t < 0.22 ? WATER.shallow : WATER.deep, u = t < 0.22 ? t / 0.22 : (t - 0.22) / 0.78;
        r = A[0] + (B[0] - A[0]) * u; gg = A[1] + (B[1] - A[1]) * u; b = A[2] + (B[2] - A[2]) * u;
        const wave = Math.sin(wx * 0.021 + Math.sin(wy * 0.012) * 2.2 + wy * 0.006) * 0.5 + 0.5;
        const wv = (wave > 0.86 ? 10 : 0) * (0.4 + t * 0.6);
        r += wv; gg += wv; b += wv;
      } else {
        r = CR[k] * w1 + CR[k2] * w2 + CR[k3] * w3 + CR[k4] * w4;
        gg = CG[k] * w1 + CG[k2] * w2 + CG[k3] * w3 + CG[k4] * w4;
        b = CB[k] * w1 + CB[k2] * w2 + CB[k3] * w3 + CB[k4] * w4;
        if (f < 0.07) {
          const sd = SANDS[BIOME_IDS[BI[w1 + w3 > 0.5 ? k : k2]]];
          const t = clamp((f - 0.045) / 0.025, 0, 1);

Ground.get = function (cx, cy, force) {

Ground.drawCoast = function (c, v, t) {

Ground.drawRoads = function (c, v) {

const PLAYER_BREEDS = ['corgi', 'beagle', 'husky', 'golden', 'dalmatian', 'pug', 'dachshund', 'poodle'];

function legPath(c, x, y, len, w, ang) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); rrect(c, -w / 2, 0, w, len, w / 2); c.restore();
}

// st: { face, t, move, atk, roll, hurt, swim, sc, hat, item, collar, talk, sit, dig, look (0..1 up/down) }
function drawDog(c, x, y, L, st) {
  const sc = (st.sc || 1) * (L.size || 1), bl = L.bodyLen || 1, ll = L.legLen || 1, t = st.t || 0, mv = st.move || 0;
  c.save(); c.translate(x, y);
  if (st.roll >= 0 && st.roll !== undefined) { drawDogBall(c, L, st, sc); c.restore(); return; }
  c.scale((st.face || 1) * sc, sc);
  const bob = mv > 0.05 ? Math.abs(Math.sin(t * 13)) * 2.2 * mv : Math.sin(t * 2.4) * 0.6;
  const lunge = st.atk > 0 ? Math.sin(st.atk * Math.PI) * 7 : 0;
  c.translate(lunge, 0);
  if (st.swim) { c.beginPath(); c.rect(-60, -80, 120, 80 - 11); c.clip(); c.translate(0, 7); }
  const legH = 12 * ll, by = -legH - 7 - bob;           // body centre y
  const hx = 13 * bl + 1, hy = by - 13 + (st.dig ? 9 : 0) + (st.atk > 0 ? -2 : 0), hr = 12;
  const swing = Math.sin(t * 13) * 0.55 * mv;
  const far = shade(L.body, -0.18), sock = L.socks ? L.belly : null;
  // far legs
  if (!st.sit) {
    legPath(c, -9 * bl + 3, by + 3, legH + bob, 6, -swing); fo(c, sock ? shade(sock, -0.12) : far, 2.2);
    legPath(c, 8 * bl + 3, by + 3, legH + bob, 6, swing); fo(c, sock ? shade(sock, -0.12) : far, 2.2);
  }
  // tail
  const wag = Math.sin(t * (st.wagFast ? 22 : 9)) * (st.wagFast ? 0.6 : 0.35);
  c.save(); c.translate(-13 * bl, by - 3); c.rotate(-0.5 + wag);
  switch (L.tail) {
    case 'fluffy': c.beginPath(); c.ellipse(-3, -9, 6, 12, -0.3, 0, TAU); fo(c, L.body, 2.4); if (L.tip) { c.beginPath(); c.ellipse(-5, -17, 4, 5, -0.3, 0, TAU); c.fillStyle = L.tip; c.fill(); } break;
    case 'curl': c.beginPath(); c.arc(0, -10, 8, Math.PI * 0.5, Math.PI * 2.3); c.lineWidth = 6.5; c.strokeStyle = OUT; c.stroke(); c.lineWidth = 3.5; c.strokeStyle = L.body; c.stroke(); break;
    case 'stub': circ(c, -1, -2, 4.5); fo(c, L.body, 2.2); break;
    case 'pom': c.beginPath(); c.moveTo(0, 0); c.lineTo(-4, -12); c.lineWidth = 5.5; c.strokeStyle = OUT; c.stroke(); c.lineWidth = 2.5; c.strokeStyle = L.body; c.stroke(); circ(c, -5, -15, 6); fo(c, L.belly, 2.2); break;
    default: c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-6, -8, -4, -18); c.lineWidth = 6; c.strokeStyle = OUT; c.stroke(); c.lineWidth = 3; c.strokeStyle = L.body; c.stroke(); if (L.tip) { circ(c, -4, -17, 2.4); c.fillStyle = L.tip; c.fill(); }
  }
  c.restore();
  // body
  c.beginPath(); c.ellipse(0, by, 15 * bl, 9.5, 0, 0, TAU); fo(c, L.body);
  c.save(); c.beginPath(); c.ellipse(0, by, 15 * bl - 1, 8.5, 0, 0, TAU); c.clip();
  c.fillStyle = L.belly; c.beginPath(); c.ellipse(3, by + 7, 13 * bl, 6, 0, 0, TAU); c.fill();
  if (L.saddle) { c.fillStyle = L.saddle; c.beginPath(); c.ellipse(-3, by - 7, 12 * bl, 6.5, -0.05, 0, TAU); c.fill(); }
  if (L.spots) { c.fillStyle = L.spots; for (const [sx, sy, r] of [[-8, -3, 2.6], [-1, -5, 2], [5, -1, 2.4], [-5, 3, 1.8], [9, -5, 1.6]]) { circ(c, sx * bl, by + sy, r); c.fill(); } }
  if (L.shaggy) { c.strokeStyle = shade(L.body, -0.12); c.lineWidth = 1.4; for (let i = -10; i <= 10; i += 5) { c.beginPath(); c.moveTo(i * bl, by - 6); c.quadraticCurveTo(i * bl + 2, by, i * bl, by + 5); c.stroke(); } }
  c.restore();
  // near legs
  if (!st.sit) {
    legPath(c, -9 * bl, by + 4, legH + bob, 6.5, swing); fo(c, sock || L.body, 2.4);
    legPath(c, 8 * bl, by + 4, legH + bob, 6.5, -swing); fo(c, sock || L.body, 2.4);
  } else {
    c.beginPath(); c.ellipse(-8 * bl, by + 7, 8, 6, 0, 0, TAU); fo(c, L.body, 2.2);

  // head
  c.save(); c.translate(hx, hy); c.rotate((st.look || 0) * 0.25 + (st.atk > 0 ? -0.12 * Math.sin(st.atk * Math.PI) : 0));
  drawDogHead(c, L, st, hr);
  c.restore();
  c.restore();
  if (st.swim) { c.save(); c.translate(x, y); c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2.5; c.beginPath(); c.ellipse(0, -4, 24 * sc * bl, 6 * sc, 0, 0, TAU); c.stroke(); c.restore(); }
}

function drawDogHead(c, L, st, hr) {
  const far = shade(L.ear || L.body, -0.15), t = st.t || 0;
  const snx = L.snout === 'long' ? 10 : L.snout === 'short' ? 6 : 8, srx = L.snout === 'long' ? 9 : L.snout === 'short' ? 5.5 : 7.5;
  // far ear
  if (L.earType === 'point' || L.earType === 'big') { c.beginPath(); c.moveTo(2, -hr + 4); c.lineTo(6, -hr - (L.earType === 'big' ? 13 : 9)); c.lineTo(10, -hr + 6); c.closePath(); fo(c, far, 2.2); }
  else { c.beginPath(); c.ellipse(5, -hr + 7, 5, 9, -0.2, 0, TAU); fo(c, far, 2.2); }
  // head shape
  circ(c, 0, 0, hr); fo(c, L.body);
  c.save(); circ(c, 0, 0, hr - 1); c.clip();
  if (L.mask) { c.fillStyle = L.mask; c.beginPath(); c.ellipse(7, 4, 9, 8, 0, 0, TAU); c.fill(); }
  if (L.blaze) { c.fillStyle = L.belly; c.beginPath(); c.moveTo(4, -hr); c.quadraticCurveTo(9, -4, 8, 2); c.lineTo(3, 2); c.quadraticCurveTo(4, -4, 1, -hr); c.fill(); }
  if (L.cheeks) { c.fillStyle = L.cheeks; c.beginPath(); c.ellipse(5, 6, 6, 4, 0, 0, TAU); c.fill(); }
  if (L.shaggy) { c.fillStyle = L.belly; c.beginPath(); c.ellipse(-1, -7, 12, 6, 0, 0, TAU); c.fill(); }
  c.restore();
  // muzzle
  const mcol = L.mask && L.mask !== '#ffffff' && L.mask !== '#fff3e0' ? L.mask : L.blaze || L.mask ? L.belly : L.muzzle || shade(L.body, 0.25);
  c.beginPath(); c.ellipse(snx, 4, srx, 5.6, 0, 0, TAU); fo(c, mcol, 2.2);
  // nose
  c.fillStyle = OUT; c.beginPath(); c.ellipse(snx + srx - 1.5, 1.6, 3, 2.4, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,0.7)'; circ(c, snx + srx - 2.2, 0.8, 0.8); c.fill();
  // mouth
  c.strokeStyle = OUT; c.lineWidth = 1.6;
  if (st.talk && Math.sin(t * 18) > 0) { c.fillStyle = '#7a2f45'; c.beginPath(); c.ellipse(snx + 2, 8, 3.5, 2.6, 0, 0, TAU); c.fill(); }
  else { c.beginPath(); c.moveTo(snx + srx - 3, 5); c.quadraticCurveTo(snx + 2, 9, snx - 2, 6); c.stroke(); }
  if (st.pant) { c.fillStyle = '#ff7f9a'; c.beginPath(); c.ellipse(snx + 1, 10 + Math.sin(t * 10), 2.6, 3.8, 0, 0, TAU); c.fill(); c.lineWidth = 1.4; c.stroke(); }
  // eye
  const ex = 3, ey = -3;
  if (L.droopy) { c.fillStyle = shade(L.body, -0.2); c.beginPath(); c.ellipse(ex, ey + 2.5, 4, 2.5, 0, 0, TAU); c.fill(); }
  const blink = (t % 3.7) > 3.58;
  if (st.happy || blink) { c.beginPath(); c.arc(ex, ey + 1, 2.8, Math.PI * 1.1, Math.PI * 1.9); c.lineWidth = 2; c.strokeStyle = OUT; c.stroke(); }
  else {
    if (L.dark) { c.fillStyle = '#d8cfd6'; c.beginPath(); c.ellipse(ex, ey, 3.6, 4.2, 0, 0, TAU); c.fill(); }
    c.fillStyle = L.eye || OUT; c.beginPath(); c.ellipse(ex, ey, 2.5, 3.1, 0, 0, TAU); c.fill();
    if (L.eye) { c.fillStyle = OUT; circ(c, ex + 0.5, ey, 1.2); c.fill(); }
    c.fillStyle = '#fff'; circ(c, ex + 0.9, ey - 1.2, 1); c.fill();
  }
  // brow when angry
  if (st.angry) { c.beginPath(); c.moveTo(ex - 4, ey - 6); c.lineTo(ex + 3, ey - 4); c.lineWidth = 2; c.stroke(); }
  // blush
  c.fillStyle = 'rgba(255,120,150,0.35)'; c.beginPath(); c.ellipse(-1, 5, 3, 2, 0, 0, TAU); c.fill();
  // near ear
  const flap = Math.sin(t * 9) * 0.08;

// st: { face, t, move, atk, hurt, sc, alpha, tele (0..1 windup) }
function drawCritter(c, x, y, S, st) {
  const sc = st.sc || 1, t = st.t || 0, mv = st.move || 0;

  c.translate(-wind * 3, 0);
  if (S.kind === 'squirrel') drawSquirrelBody(c, S, st, mv, t);
  else drawCatBody(c, S, st, mv, t);
  c.restore();
}

function drawCatBody(c, S, st, mv, t) {
  const bob = mv > 0.05 ? Math.abs(Math.sin(t * 12)) * 2 * mv : Math.sin(t * 2.2) * 0.5;
  const ghost = S.ghost;
  const by = (ghost ? -22 + Math.sin(t * 3) * 3 : -19) - bob, hx = 14, hy = by - 12;
  const swing = Math.sin(t * 12) * 0.5 * mv, far = shade(S.body, -0.18);

  // far legs

  else if (skunk) { c.rotate(-0.2 + tw); blobShape(c, [[-4, -12, 9], [-6, -24, 10], [2, -32, 8]], S.body); c.strokeStyle = S.stripe; c.lineWidth = 4; c.beginPath(); c.moveTo(-2, -6); c.quadraticCurveTo(-8, -22, 2, -34); c.stroke(); }

  }

  if (ghost) { c.moveTo(-15, by); c.quadraticCurveTo(-15, by - 10, 0, by - 10); c.quadraticCurveTo(15, by - 10, 15, by); for (let i = 0; i <= 6; i++) c.lineTo(15 - i * 5, by + 10 + (i % 2 ? -4 : 2) + Math.sin(t * 6 + i) * 2); c.closePath(); fo(c, S.body); }
  else { c.ellipse(0, by, 15 * (S.fluffy ? 1.1 : 1), 9 * (S.fluffy ? 1.15 : 1), 0, 0, TAU); fo(c, S.body); }
  c.save(); c.beginPath(); c.ellipse(0, by, 14, 8.5, 0, 0, TAU); c.clip();
  c.fillStyle = S.belly; c.beginPath(); c.ellipse(3, by + 7, 12, 5.5, 0, 0, TAU); c.fill();
  if (S.stripes) { c.strokeStyle = S.stripes; c.lineWidth = 2.6; for (let i = -9; i <= 7; i += 5) { c.beginPath(); c.moveTo(i, by - 9); c.quadraticCurveTo(i + 2, by - 4, i, by); c.stroke(); } }
  if (S.spots) { c.strokeStyle = S.spots; c.lineWidth = 1.8; for (const [a, b] of [[-8, -3], [-1, -5], [6, -2], [-4, 2]]) { c.beginPath(); c.arc(a, by + b, 2.2, 0.3, 5.5); c.stroke(); } }

  if (skunk) { c.fillStyle = S.stripe; c.beginPath(); c.ellipse(0, by - 7, 14, 2.6, 0, 0, TAU); c.fill(); }
  if (S.wraps) { c.strokeStyle = S.wraps; c.lineWidth = 1.6; for (let i = -12; i <= 10; i += 4) { c.beginPath(); c.moveTo(i, by - 9); c.lineTo(i + 5, by + 9); c.stroke(); } }

  // head

// a white flash when something is hit: draw it on a scratch canvas, whiten it there, then copy it over
const Flash = { c: null };
function flashDraw(c, x, y, w, h, k, fn) {
  if (!(k > 0.04)) return fn(c);
  const m = c.getTransform(), a = Math.hypot(m.a, m.b) || 1;
  const pw = Math.ceil(w * a), ph = Math.ceil(h * a);
  if (!Flash.c || Flash.c.width < pw || Flash.c.height < ph) { Flash.c = mkCanvas(Math.max(pw, 256), Math.max(ph, 256)); }
  const f = Flash.c, g = f.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, pw + 2, ph + 2);
  g.setTransform(a, 0, 0, a, -(x - w / 2) * a, -(y - h) * a);
  g.lineJoin = 'round'; g.lineCap = 'round'; g.globalAlpha = c.globalAlpha;
  fn(g);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = `rgba(255,255,255,${clamp(k, 0, 1) * 0.85})`; g.fillRect(0, 0, pw, ph); g.globalCompositeOperation = 'source-over';
  const ga = c.globalAlpha; c.globalAlpha = 1;
  c.drawImage(f, 0, 0, pw, ph, x - w / 2, y - h, w, h);
  c.globalAlpha = ga;
}

// where the roads leave each town, so no house sits on one
function roadExits(T) {
  const out = [];
  for (const poly of World.roadPolys) for (const end of [0, 1]) {
    const pts = end ? poly.slice().reverse() : poly;
    if (dist(pts[0][0], pts[0][1], T.x, T.y) > 30) continue;
    const q = pts.find((p) => dist(p[0], p[1], T.x, T.y) > T.r * 0.55) || pts[pts.length - 1];
    out.push(angTo(T.x, T.y, q[0], q[1]));
  }
  // roads that pass through a town on their way somewhere
  for (const poly of World.roadPolys) for (let i = 1; i < poly.length - 1; i++) {
    const p = poly[i];
    if (dist(p[0], p[1], T.x, T.y) < T.r * 0.3) { const a = poly[Math.max(0, i - 3)], b = poly[Math.min(poly.length - 1, i + 3)]; out.push(angTo(T.x, T.y, a[0], a[1]), angTo(T.x, T.y, b[0], b[1])); }
  }
  return out;
}
World.buildTowns = function () {
  this.blds = [];
  this.inters = [];
  for (const id in TOWN_LAYOUT) {
    const T = TOWNS[id], exits = roadExits(T);
    for (const [kind, dx0, dy0, v, extra] of TOWN_LAYOUT[id]) {
      let dx = dx0, dy = dy0;
      // swing a building around the town centre until it is off the road
      const big = kind !== 'lamp' && kind !== 'sign' && BLD[kind] ? BLD[kind].foot[0] : 0;
      if (big && kind !== 'castle') {
        const d = Math.hypot(dx, dy);
        for (let k = 0; k < 3; k++) {
          const a = Math.atan2(dy, dx), need = Math.atan((big / 2 + 36) / Math.max(60, d));
          const e = exits.find((ex) => Math.abs(angDiff(ex, a)) < need);
          if (e == null) break;
          const na = e + (angDiff(e, a) >= 0 ? need + 0.05 : -need - 0.05);
          dx = Math.cos(na) * d; dy = Math.sin(na) * d;
        }
      }
      const x = T.x + dx, y = T.y + dy, opt = Object.assign({}, extra || {});
      if (T.biome === 'snow') opt.snow = 1;
      if (kind === 'lamp') { this.addProp(propAt('lamp', x, y)); continue; }
      const d = BLD[kind];
      const b = { kind: 'bld', bk: kind, x, y, v: v || 0, opt, town: id, r: 0 };
      if (d.foot[0]) b.box = [x - d.foot[0] / 2, y - d.foot[1], d.foot[0], d.foot[1]];
      this.addProp(b); this.blds.push(b);
      let svc = opt.svc || (kind === 'inn' || opt.inn ? 'inn' : kind === 'board' ? 'board' : kind === 'tent' && v === 0 ? 'inn' : null);
      if (svc) this.inters.push({ kind: svc, x, y: y + 14, r: kind === 'castle' ? 70 : 54, town: id, b });
      if (kind === 'sign' || kind === 'well' || kind === 'fountain' || kind === 'campfire') this.inters.push({ kind: 'sign', x, y: y + 10, r: 46, town: id, b, sub: kind });
    }
    // a welcome sign on the road into town
    this.inters.push({ kind: 'townname', x: T.x, y: T.y, r: T.r * 0.7, town: id });
  }
  // the docks at Fetchwick and Mittens Landing: find the shore nearest the right direction
  const shore = (x, y, dx, dy) => { let px = x, py = y; for (let i = 0; i < 120 && this.Fat(px, py) > 0.02; i++) { px += dx * 12; py += dy * 12; } return { x: px, y: py }; };
  const fw = shore(TOWNS.fetchwick.x, TOWNS.fetchwick.y + 40, 1, 0.08);
  this.dock = { x: fw.x - 30, y: fw.y, to: 'isle' };
  const ld = shore(TOWNS.landing.x + 40, TOWNS.landing.y, -1, 0);
  this.dock2 = { x: ld.x + 30, y: ld.y, to: 'main' };
  for (const dk of [this.dock, this.dock2]) {
    for (const g of this.grid) for (let i = g.length - 1; i >= 0; i--) { const q = g[i]; if (q.kind !== 'bld' && dist(q.x, q.y, dk.x, dk.y) < 170) { g.splice(i, 1); q.gone = true; } }
    const b = { kind: 'bld', bk: 'boat', x: dk.x + (dk.to === 'isle' ? 120 : -120), y: dk.y + 40, v: 0, opt: {}, r: 0, dockOf: dk };
    this.addProp(b); this.blds.push(b);
    this.inters.push({ kind: 'dock', x: dk.x + (dk.to === 'isle' ? -50 : 50), y: dk.y + 20, r: 80, dock: dk });
  }
  // dungeon entrances
  for (const id in DUNGEON_SPOTS) {
    const s = DUNGEON_SPOTS[id], d = BLD[s.art];
    const b = { kind: 'bld', bk: s.art, x: s.x, y: s.y, v: 0, opt: { spooky: id === 'b_haunt' }, r: 0, dungeon: id };
    b.box = [s.x - d.foot[0] / 2, s.y - d.foot[1], d.foot[0], d.foot[1]];
    this.addProp(b); this.blds.push(b);
    this.inters.push({ kind: 'dungeon', id, x: s.x, y: s.y + 16, r: 64, b });
  }
};

// The hero, combat, projectiles, warnings and effects.
let G = null;           // the saved game
const S = { scene: 'world', dun: null, foes: [], npcs: [], proj: [], tele: [], fx: [], nums: [], picks: [], clouds: [], time: 0, packs: [], hitstop: 0, slowmo: 1 };

const DIFF = [{ name: 'Easy', dmg: 0.6, hp: 0.8 }, { name: 'Normal', dmg: 1, hp: 1 }, { name: 'Hard', dmg: 1.35, hp: 1.25 }];
const SET = Object.assign({ music: 0.5, sfx: 0.8, shake: 1, touch: 'auto', nums: 1 }, LS.get('dq_settings', {}));
function saveSettings() { LS.set('dq_settings', SET); }

function newGame(name, breed, diff) {
  G = {
    game: 'dogquest', v: 1, t: 0, lv: 1, xp: 0, gold: 0, hero: { name, breed }, hp: 1, mp: 0,
    x: 0, y: 0, respawn: 'waggington', main: 0, mainN: 0, side: {}, bounty: {}, items: { stick: 1, collar: 1 }, eq: { mouth: 'stick', head: null, body: 'collar' },
    tricks: {}, slots: [null, null, null, null], flags: {}, chests: {}, digs: {}, cleared: {}, pieces: 0, fog: '', diff: diff == null ? 1 : diff, won: false, qi: {}, picked: {}, met: {}, kills: 0, ch: 'Chapter 1',
  };
  const T = TOWNS.waggington;
  G.x = T.x + 120; G.y = T.y + 150;
  G.hp = maxHp(); G.mp = maxMp();
  return G;
}

// ---------- stats
function gearSum(k) { let s = 0; for (const sl in G.eq) { const id = G.eq[sl]; if (id) s += itemStat(id, G.items[id], k); } return s; }
function maxHp() { return 70 + 16 * (G.lv - 1) + gearSum('hp'); }
function maxMp() { return 50 + 2 * (G.lv - 1); }
function heroAtk() { return 8 + 3 * (G.lv - 1) + gearSum('atk'); }
function heroMag() { return 8 + 3 * (G.lv - 1) + gearSum('mag'); }
function heroDef() { return Math.floor(G.lv * 0.6) + gearSum('def'); }
function heroSpd() { return 205 * (1 + (G.eq.body === 'cape' ? 0.1 : 0)); }
function xpNeed(l) { return Math.round(30 * Math.pow(l, 1.55)); }
function trickLv(id) { return G.tricks[id] || 0; }

function giveXp(n) {
  if (G.lv >= 30) return;
  G.xp += Math.round(n);
  while (G.xp >= xpNeed(G.lv) && G.lv < 30) {
    G.xp -= xpNeed(G.lv); G.lv++;
    G.hp = maxHp(); G.mp = maxMp();
    UI.banner('LEVEL UP!', 'Level ' + G.lv);
    Sfx.play('level');
    fxBurst(P.x, P.y - 20, '#ffd84d', 24, 260);
    fxRing(P.x, P.y - 10, '#ffd84d', 90);
  }
}
function giveGold(n) { G.gold += Math.round(n); }
function giveItem(id, quiet) {
  const had = G.items[id] || 0;
  G.items[id] = Math.min(ITEM_MAX, had + 1);
  if (!quiet) {
    if (had) UI.toast(`${ITEMS[id].name} leveled up to Lv ${G.items[id]}!`, 'item', id);
    else UI.toast(`New gear: ${ITEMS[id].name}!`, 'item', id);
  }
  // first gear in an empty slot goes straight on
  if (!had && !G.eq[ITEMS[id].slot]) G.eq[ITEMS[id].slot] = id;
  G.hp = Math.min(G.hp, maxHp());
}

// ---------- effects
function fxBurst(x, y, col, n, spd, opts) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), v = rand(0.3, 1) * (spd || 180);
    S.fx.push(Object.assign({ k: 'dot', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: rand(0.35, 0.7), r: rand(2, 4.5), col, g: 300 }, opts || {}));
  }
}
function fxRing(x, y, col, r, life) { S.fx.push({ k: 'ring', x, y, t: 0, life: life || 0.4, r, col }); }
function fxText(x, y, text, col, big) { S.nums.push({ x: x + rand(-8, 8), y, text: String(text), col, t: 0, big }); }
function fxSlash(x, y, a, r, big) { S.fx.push({ k: 'slash', x, y, a, r, t: 0, life: 0.16, big }); }
function fxPuff(x, y, n) { for (let i = 0; i < (n || 6); i++) S.fx.push({ k: 'puff', x: x + rand(-10, 10), y: y + rand(-6, 6), vx: rand(-40, 40), vy: rand(-30, -5), t: 0, life: rand(0.4, 0.7), r: rand(6, 11) }); }
function shake(n) { if (SET.shake) Cam.shake = Math.max(Cam.shake, n); }

// ---------- warnings (the red areas) and hit tests
function inShape(sh, x, y, rr) {
  const dx = x - sh.x, dy = y - sh.y;
  switch (sh.shape) {
    case 'circle': return dx * dx + dy * dy < (sh.r + rr) * (sh.r + rr);
    case 'ring': { const d = Math.hypot(dx, dy); return d < sh.r2 + rr && d > sh.r - rr; }
    case 'cone': { const d = Math.hypot(dx, dy); if (d > sh.r + rr) return false; if (d < 16) return true; return Math.abs(angDiff(sh.a, Math.atan2(dy, dx))) < sh.half + rr / Math.max(d, 1); }
    case 'rect': { const ca = Math.cos(sh.a), sa = Math.sin(sh.a); const u = dx * ca + dy * sa, v = -dx * sa + dy * ca; return u > -rr && u < sh.len + rr && Math.abs(v) < sh.w / 2 + rr; }
  }
  return false;
}
// a warning: when its time is up it hits the hero if the hero is still inside
function warn(sh) {
  const t = Object.assign({ t: 0, dmg: 10, onDone: null }, sh);
  S.tele.push(t);
  return t;
}
function updateTele(dt) {
  for (let i = S.tele.length - 1; i >= 0; i--) {
    const w = S.tele[i];
    if (w.follow && w.follow.hp > 0) { w.x = w.follow.x; w.y = w.follow.y; }
    w.t += dt;
    if (w.src && (w.src.hp <= 0 || w.src.gone) && !w.keep) { S.tele.splice(i, 1); continue; }
    if (w.t >= w.dur) {
      S.tele.splice(i, 1);
      if (!w.noHit && P.state !== 'dead' && inShape(w, P.x, P.y, P.r * 0.55)) heroHurt(w.dmg, w.x, w.y, w);
      if (w.onDone) w.onDone(w);
      if (w.boom) { fxBurst(w.x, w.y, w.boom, 10, 160); }
    }
  }
}
function drawTele(c) {
  for (const w of S.tele) {
    const p = clamp(w.t / w.dur, 0, 1);
    c.save();
    c.fillStyle = 'rgba(232,58,74,0.20)'; c.strokeStyle = 'rgba(200,30,50,0.75)'; c.lineWidth = 2.5;
    const inner = 'rgba(232,58,74,0.38)';
    switch (w.shape) {
      case 'circle': circ(c, w.x, w.y, w.r); c.fill(); c.stroke(); c.fillStyle = inner; circ(c, w.x, w.y, w.r * p); c.fill(); break;
      case 'ring': c.beginPath(); c.arc(w.x, w.y, w.r2, 0, TAU); c.arc(w.x, w.y, w.r, 0, TAU, true); c.fill('evenodd'); c.beginPath(); c.arc(w.x, w.y, w.r2, 0, TAU); c.stroke(); c.beginPath(); c.arc(w.x, w.y, w.r, 0, TAU); c.stroke();
        c.fillStyle = inner; c.beginPath(); c.arc(w.x, w.y, w.r + (w.r2 - w.r) * p, 0, TAU); c.arc(w.x, w.y, w.r, 0, TAU, true); c.fill('evenodd'); break;
      case 'cone': c.beginPath(); c.moveTo(w.x, w.y); c.arc(w.x, w.y, w.r, w.a - w.half, w.a + w.half); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = inner; c.beginPath(); c.moveTo(w.x, w.y); c.arc(w.x, w.y, w.r * p, w.a - w.half, w.a + w.half); c.closePath(); c.fill(); break;

// ---------- the hero gets hurt

  G.hp -= d;

  P.hurt = 1; P.inv = 0.7;
  const a = angTo(sx, sy, P.x, P.y);

}

// ---------- the hero hits things
function foeHurt(f, dmg, a, kb, opts) {
  if (f.hp <= 0 || f.gone) return 0;
  opts = opts || {};
  const crit = Math.random() < 0.08;
  let d = Math.max(1, Math.round(dmg * rand(0.9, 1.1) * (crit ? 1.6 : 1)));
  if (f.armorT > 0) d = Math.round(d * 0.5);
  f.hp -= d; f.hurt = 1;
  if (!f.boss || opts.bigKb) { f.kbx = Math.cos(a) * kb * (f.boss ? 0.15 : 1); f.kby = Math.sin(a) * kb * (f.boss ? 0.15 : 1); }

  if (SET.nums) fxText(f.x, f.y - 30 * (f.sc || 1) - 14, d, crit ? '#ffd84d' : '#ffffff', crit);
  fxBurst(f.x, f.y - 16, '#fff6d0', 5, 140);

// melee
function heroSwing() {
  const third = P.atkN === 2;
  const a = P.dir;
  P.state = 'atk'; P.st = 0; P.atkCD = third ? 0.36 : 0.24; P.combo = 0.55;
  const range = third ? 80 : 66;
  fxSlash(P.x + Math.cos(a) * 18, P.y - 16 + Math.sin(a) * 18, a, range * 0.85, third);
  Sfx.play('swing');
  P.lungeT = 0.12; P.lungeA = a;
  let hits = 0;
  for (const f of S.foes) {
    if (f.hp <= 0 || f.gone || f.spawnT > 0) continue;
    const d = dist(P.x, P.y, f.x, f.y);
    if (d > range + f.r) continue;
    if (d > 20 && Math.abs(angDiff(a, angTo(P.x, P.y, f.x, f.y))) > 1.15) continue;
    if (S.scene === 'dungeon' && !Dungeon.losClear(P.x, P.y, f.x, f.y)) continue;

}

// ---------- the hero's update
function updateHero(dt) {
  P.t += dt;
  P.hurt = Math.max(0, P.hurt - dt * 5);
  P.inv = Math.max(0, P.inv - dt);
  P.atkCD -= dt; P.rollCD -= dt; P.combo -= dt; P.slow = Math.max(0, P.slow - dt);
  for (const k in P.cds) P.cds[k] -= dt;
  if (P.combo <= 0) P.atkN = 0;
  if (G.mp < maxMp()) G.mp = Math.min(maxMp(), G.mp + dt * 1.2);
  if (G.eq.head === 'chef' && G.hp < maxHp() && G.hp > 0) { P.regenT += dt; if (P.regenT > 1) { P.regenT = 0; G.hp = Math.min(maxHp(), G.hp + 1 + Math.floor(G.lv / 4)); } }
  if (P.state === 'dead') { P.st += dt; return; }
  const mx = Input.mx, my = Input.my, mlen = Math.hypot(mx, my);
  // aim: soft lock on the nearest foe, else the way you face
  if (mlen > 0.2) P.dir = Math.atan2(my, mx);
  const near = nearestFoe(P.x, P.y, 150);
  let aimA = near ? angTo(P.x, P.y, near.x, near.y) : P.dir;
  if (Input.aimMouse && performance.now() - Input.aimMouse.t < 300) { const w = screenToWorld(Input.aimMouse.x, Input.aimMouse.y); aimA = angTo(P.x, P.y - 14, w.x, w.y); }
  const inWater = S.scene === 'world' && World.inWater(P.x, P.y);
  P.swim = inWater && G.flags.swim ? 1 : 0;
  const busy = P.state === 'atk' || P.state === 'trick' || P.state === 'roll' || P.state === 'zoom' || P.state === 'dig' || P.state === 'digspot';
  // actions
  if (Game.canAct()) {
    const wantAtk = Input.hit.atk, wantAct = Input.hit.act;
    const it = Interact.target;
    if ((wantAct || (wantAtk && it && !nearestFoe(P.x, P.y, 170))) && it) { Interact.use(it); Input.hit.atk = false; }
    else if (wantAtk && !P.swim && P.atkCD <= 0 && (P.state === 'idle' || P.state === 'walk' || (P.state === 'atk' && P.st > 0.12))) { P.dir = aimA; heroSwing(); }
    if (Input.hit.roll && P.rollCD <= 0 && !P.swim && !busy) {
      P.state = 'roll'; P.st = 0; P.dodged = 0; P.rollA = mlen > 0.2 ? Math.atan2(my, mx) : P.dir; Sfx.play('roll'); fxPuff(P.x, P.y, 3);
    }
    for (let i = 0; i < 4; i++) if (Input.hit['t' + (i + 1)] && !busy) { const id = G.slots[i]; if (id && id !== 'zoom') P.dir = aimA; useTrick(i); }
  }
  // movement
  let spd = heroSpd() * (P.swim ? 0.62 : 1) * (P.slow > 0 ? 0.5 : 1);
  let vx = 0, vy = 0;
  P.st += dt;
  switch (P.state) {
    case 'roll': {
      const k = 1 - P.st / 0.32;
      vx = Math.cos(P.rollA) * 560 * (0.5 + k * 0.6); vy = Math.sin(P.rollA) * 560 * (0.5 + k * 0.6);
      if (P.st > 0.32) { P.state = 'idle'; P.rollCD = 0.12; }
      break;
    }
    case 'zoom': {
      vx = Math.cos(P.zoomA) * 1250; vy = Math.sin(P.zoomA) * 1250;
      S.fx.push({ k: 'dot', x: P.x + rand(-6, 6), y: P.y - rand(4, 24), vx: 0, vy: 0, t: 0, life: 0.35, r: rand(3, 6), col: '#7fd0ff', g: 0 });
      for (const f of S.foes) if (f.hp > 0 && !f.gone && !P.zoomHit.has(f) && dist(P.x, P.y, f.x, f.y) < f.r + 28) { P.zoomHit.add(f); foeHurt(f, P.zoomDmg, P.zoomA + (Math.random() < 0.5 ? 1.2 : -1.2), 380); }
      if (P.st > 0.24) { P.state = 'idle'; P.inv = 0.15; }
      break;
    }
    case 'dig': {
      vx = mx * spd * 0.7; vy = my * spd * 0.7;
      if (Math.random() < 0.5) S.fx.push({ k: 'dot', x: P.x + rand(-10, 10), y: P.y - 2, vx: rand(-60, 60), vy: rand(-120, -50), t: 0, life: 0.4, r: rand(2, 4), col: '#a87a50', g: 400 });
      if (P.st > 0.75) {
        P.state = 'idle'; P.inv = 0.25;
        shake(8); fxBurst(P.x, P.y - 6, '#a87a50', 26, 300); fxRing(P.x, P.y - 4, '#d9a46a', 140); Sfx.play('boom');
        for (const f of S.foes) if (f.hp > 0 && !f.gone && dist(P.x, P.y, f.x, f.y) < 140 + f.r) foeHurt(f, P.digDmg, angTo(P.x, P.y, f.x, f.y), 360, { stun: 1.1 });
      }
      break;
    }
    case 'digspot': { if (P.st > 0.8) { P.state = 'idle'; Interact.finishDig(); } break; }
    case 'atk': {
      if (P.lungeT > 0) { P.lungeT -= dt; vx = Math.cos(P.lungeA) * 190; vy = Math.sin(P.lungeA) * 190; }
      else { vx = mx * spd * 0.25; vy = my * spd * 0.25; }
      if (P.st > 0.22) P.state = 'idle';
      break;
    }
    case 'trick': { vx = mx * spd * 0.2; vy = my * spd * 0.2; if (P.st > P.trickDur) P.state = 'idle'; break; }
    default: {
      vx = mx * spd; vy = my * spd;
      P.state = mlen > 0.15 ? 'walk' : 'idle';
    }
  }
  if (P.kbx) { vx += P.kbx; vy += P.kby; P.kbx *= Math.pow(0.0005, dt); P.kby *= Math.pow(0.0005, dt); if (Math.abs(P.kbx) + Math.abs(P.kby) < 8) P.kbx = P.kby = 0; }
  P.moving = clamp(Math.hypot(vx, vy) / heroSpd(), 0, 1.2);
  if (Math.abs(vx) > 8) P.face = vx > 0 ? 1 : -1;
  if (P.state === 'atk' || P.state === 'trick') P.face = Math.cos(P.dir) >= 0 ? 1 : -1;
  moveBody(P, vx * dt, vy * dt, true);
  // the world remembers where you've been
  if (S.scene === 'world') { G.x = P.x; G.y = P.y; Fog.reveal(P.x, P.y); }
}

// move a round body, sliding along walls
function moveBody(b, dx, dy, hero) {
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 10));
  dx /= steps; dy /= steps;
  for (let i = 0; i < steps; i++) {
    if (!blockedAt(b.x + dx, b.y, b.r, b, hero)) b.x += dx; else if (b.state === 'zoom') { b.st = 1; }
    if (!blockedAt(b.x, b.y + dy, b.r, b, hero)) b.y += dy;

}
function blockedAt(x, y, r, b, hero) {
  if (S.scene === 'dungeon') return Dungeon.blocked(x, y, r, b);
  if (x < 60 || y < 60 || x > WW - 60 || y > WH - 60) return true;
  if (b.fly) return World.Fat(x, y) < -0.2 && !b.overWater ? false : false;
  const swim = hero ? !!G.flags.swim : false;
  if (!hero && World.Fat(x, y) < 0.02) return true;
  return World.blocked(x, y, r * 0.8, swim);
}
function nearestFoe(x, y, r) {
  let best = null, bd = r * r;
  for (const f of S.foes) { if (f.hp <= 0 || f.gone || f.spawnT > 0) continue; const d = dist2(x, y, f.x, f.y); if (d < bd) { bd = d; best = f; } }
  return best;
}
function screenToWorld(sx, sy) { return { x: Cam.x + (sx - SW / 2) / Cam.z, y: Cam.y + (sy - SH / 2) / Cam.z }; }

// ---------- projectiles
function updateProj(dt) {
  for (let i = S.proj.length - 1; i >= 0; i--) {
    const p = S.proj[i];
    p.life -= dt; p.spin = (p.spin || 0) + dt * 14;
    if (p.lob) {
      p.lob.t += dt;
      const k = clamp(p.lob.t / p.lob.dur, 0, 1);
      p.x = lerp(p.lob.x0, p.lob.x1, k); p.y = lerp(p.lob.y0, p.lob.y1, k); p.z = Math.sin(k * Math.PI) * p.lob.h;
      if (k >= 1) S.proj.splice(i, 1);
      continue;
    }
    if (p.k === 'fetch') {
      p.out += Math.hypot(p.vx, p.vy) * dt;
      if (p.out > 430 || p.back) {
        p.back = 1;
        const a = angTo(p.x, p.y, P.x, P.y - 14), sp = 760;
        p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
        if (!p.cleared) { p.cleared = 1; p.hit.clear(); }
        if (dist(p.x, p.y, P.x, P.y - 14) < 24) { S.proj.splice(i, 1); continue; }
      }
    }
    const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    const wall = S.scene === 'dungeon' ? Dungeon.blocked(nx, ny + 14, 4) : false;
    if (wall) {
      if (p.bounce) { const bx = Dungeon.blocked(nx, p.y + 14, 4), by = Dungeon.blocked(p.x, ny + 14, 4); if (bx) p.vx = -p.vx; if (by) p.vy = -p.vy; if (!bx && !by) { p.vx = -p.vx; p.vy = -p.vy; } }
      else if (p.k === 'fetch') { p.back = 1; } else { fxBurst(p.x, p.y, '#ffffff', 5, 100); S.proj.splice(i, 1); continue; }
    }
    else { p.x = nx; p.y = ny; }
    if (p.from === 'hero') {
      for (const f of S.foes) if (f.hp > 0 && !f.gone && !p.hit.has(f) && dist(p.x, p.y, f.x, f.y - 14) < p.r + f.r + 4) { p.hit.add(f); foeHurt(f, p.dmg, Math.atan2(p.vy, p.vx), 200); }

    pk.alive = pk.alive.filter((f) => !f.gone);
    const d = dist(P.x, P.y, pk.x, pk.y);
    if (pk.alive.length) {
      if (d > 1700) { for (const f of pk.alive) f.gone = true; pk.alive = []; pk.spawned = 0; }
      else if (pk.alive.every((f) => f.hp <= 0)) { pk.cool = 75; }
      continue;
    }
    if (pk.spawned && pk.cool > 0) continue;
    if (d < 1100 && (pk.x < v.x0 - 40 || pk.x > v.x1 + 40 || pk.y < v.y0 - 40 || pk.y > v.y1 + 40 || !pk.spawned)) {
      if (pk.cool > 0) continue;
      const table = REGION_FOES[pk.region];
      for (let i = 0; i < pk.n; i++) {
        const k = weighted(table), a = rand(0, TAU), r = rand(10, 70);
        let x = pk.x + Math.cos(a) * r, y = pk.y + Math.sin(a) * r;
        if (World.blocked(x, y, 16, false)) { x = pk.x; y = pk.y; }
        const f = makeFoe(k, clamp(pk.lv + randi(-1, 1), 1, 30), x, y, { pack: pk, noPuff: !pk.spawned });
        f.home = { x: pk.x, y: pk.y };
        pk.alive.push(addFoe(f));
      }
      pk.spawned = 1; pk.cool = 0;
    }
  }
  // quest spawns and bounties keep their own critters near their spot
  for (const q of Quests.spawnsWanted()) {
    const tag = q.tag;
    const mine = S.foes.filter((f) => f.quest === tag && !f.gone && f.hp > 0);
    const d = dist(P.x, P.y, q.x, q.y);
    if (d > 1800) { for (const f of mine) f.gone = true; continue; }
    if (mine.length || d > 1100) continue;
    if (q.cool && q.cool > S.time) continue;
    for (let i = 0; i < q.n; i++) {
      const a = (i / q.n) * TAU, x = q.x + Math.cos(a) * 50 * (q.n > 1 ? 1 : 0), y = q.y + Math.sin(a) * 40 * (q.n > 1 ? 1 : 0);
      addFoe(makeFoe(q.foe, q.lv, x, y, { quest: tag, elite: q.elite, bounty: q.bounty }));
    }
    q.onSpawn && q.onSpawn();
  }
};

// ---------- folk walking around town
function makeNpcs() {
  S.npcs = [];
  for (const id in NPCS) {
    const n = NPCS[id], T = TOWNS[n.town];
    let x, y;
    if (n.dock) { x = World.dock.x - 40; y = World.dock.y - 10; }
    else if (n.dock2) { x = World.dock2.x + 40; y = World.dock2.y - 10; }
    else { x = T.x + n.at[0]; y = T.y + n.at[1]; }
    const p = World.blocked(x, y, 12, false) ? World.toLand(x + 20, y + 30, 0.1) : { x, y };
    S.npcs.push({ id, def: n, x: p.x, y: p.y, home: { x: p.x, y: p.y }, face: 1, t: rand(0, 9), wx: p.x, wy: p.y, wT: rand(1, 4), r: 14, move: 0, bubble: null, bT: rand(4, 14) });
  }
}
function updateNpcs(dt) {
  for (const n of S.npcs) {
    n.t += dt; n.wT -= dt; n.move = 0;
    const dP = dist(n.x, n.y, P.x, P.y);
    if (dP < 110) { n.face = P.x > n.x ? 1 : -1; continue; }
    if (n.def.still) continue;
    if (n.wT <= 0) { n.wT = rand(2, 5); const a = rand(0, TAU), r = rand(0, 60); n.wx = n.home.x + Math.cos(a) * r; n.wy = n.home.y + Math.sin(a) * r * 0.6; }
    const d = dist(n.x, n.y, n.wx, n.wy);
    if (d > 6) { const a = angTo(n.x, n.y, n.wx, n.wy); const nx = n.x + Math.cos(a) * 45 * dt, ny = n.y + Math.sin(a) * 45 * dt; if (!World.blocked(nx, ny, 10, false)) { n.x = nx; n.y = ny; } else n.wT = 0; n.face = Math.cos(a) >= 0 ? 1 : -1; n.move = 0.5; }
    n.bT -= dt;
    if (n.bT <= 0) { n.bT = rand(9, 20); if (dP < 600) n.bubble = { text: pick(['Woof!', 'Arf!', '*sniff sniff*', '*wag wag*', pick(n.def.talk || ['Woof!'])]), t: 0 }; }
    if (n.bubble) { n.bubble.t += dt; if (n.bubble.t > 3) n.bubble = null; }
  }
}

// ---------- drawing a critter of any kind
function drawFoe(c, f) {
  const st = { face: f.face, t: f.t, move: f.move || (f.state === 'dash' ? 1 : 0), hurt: f.hurt, sc: f.sc, tele: f.state === 'wind' ? f.st / f.windT : 0, alt: f.hop ? 34 + f.hop : undefined };
  const y = f.y - (f.hop || 0);
  if (f.dead) { c.globalAlpha = 1 - f.dead / 0.35; st.sc = f.sc * (1 + f.dead); }
  if (f.spawnT > 0) c.globalAlpha = 1 - f.spawnT / 0.35;
  const sz = (f.boss ? 150 : 80) * f.sc;
  flashDraw(c, f.x, f.y + 10, sz * 1.4, sz * 1.5 + (f.hop || 0) + (f.fly ? 40 : 0), f.hurt, (c) => {
  switch (f.art) {
    case 'bee': drawBee(c, f.x, y, st); break;
    case 'crab': drawCrab(c, f.x, y, st); break;
    case 'gull': drawGull(c, f.x, f.y, st); break;
    case 'scorpion': drawScorpion(c, f.x, y, st); break;
    case 'bat': drawBat(c, f.x, y, st); break;
    case 'vacbot': drawVacbot(c, f.x, y, st); break;
    case 'vacuum': drawDreadVacuum(c, f.x, y, st); drawCritter(c, f.x - 6 * f.face, y - 88 * f.sc, CRITTERS.mittens, { face: f.face, t: f.t, sc: 1.4, hurt: f.hurt }); break;
    default: drawCritter(c, f.x, y, CRITTERS[f.art] || CRITTERS.cat, st);
  }
  });
  c.globalAlpha = 1;
  if (f.stun > 0 && !f.dead) { for (let i = 0; i < 3; i++) { const a = f.t * 5 + (i / 3) * TAU; c.fillStyle = '#ffd84d'; circ(c, f.x + Math.cos(a) * 14, f.y - 40 * f.sc + Math.sin(a) * 4, 3); c.fill(); } }
  if (f.alert > 0) { f.alert -= 1 / 60; c.font = '700 22px Fredoka, ui-rounded, sans-serif'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = OUT; c.strokeText('!', f.x, f.y - 46 * f.sc - 10); c.fillStyle = '#ffd84d'; c.fillText('!', f.x, f.y - 46 * f.sc - 10); }
}
// little level tag and health bar over a critter
function drawFoeBar(c, f) {
  if (f.boss || f.dead || f.spawnT > 0) return;
  const y = f.y - 48 * f.sc - (f.fly ? 22 : 0) - (f.hop || 0), w = f.elite ? 54 : 36;
  const diff = f.lv - G.lv, col = diff >= 4 ? '#e8475f' : diff >= 2 ? '#f2a03d' : diff <= -4 ? '#9a96aa' : '#ffffff';
  if (f.hp < f.maxHp || f.elite || f.state === 'chase' || f.state === 'wind') {
    c.fillStyle = OUT; c.beginPath(); rrect(c, f.x - w / 2 - 2, y - 2, w + 4, 8, 4); c.fill();
    c.fillStyle = '#e8475f'; c.beginPath(); rrect(c, f.x - w / 2, y, Math.max(2, w * f.hp / f.maxHp), 4, 2); c.fill();
  }
  c.font = '700 12px Fredoka, ui-rounded, sans-serif'; c.textAlign = 'center';
  const label = (f.elite ? f.name + ' ' : '') + 'Lv' + f.lv;
  c.lineWidth = 3.5; c.strokeStyle = OUT; c.strokeText(label, f.x, y - 5); c.fillStyle = col; c.fillText(label, f.x, y - 5);
}
function drawNpc(c, n) {
  const L = BREEDS[n.def.breed] || BREEDS.golden;

  drawDog(c, n.x, n.y, L, { face: n.face, t: n.t, move: n.move, hat: n.def.hat, talk: talking, collar: '#4f7fd9', wagFast: dist(n.x, n.y, P.x, P.y) < 110 });
  // a mark over folk who have something for you

function drawBubble(c, x, y, text) {
  c.font = '600 13px Fredoka, ui-rounded, sans-serif';
  const w = Math.min(220, c.measureText(text).width + 20);
