// ---- 07c_bosses.js
// Bosses: each move is a little script of red warnings.
const Bosses = { current: null };
Bosses.spawn = function (key, x, y) {
  const d = BOSSES[key], hp = Math.round(d.hp * DIFF[G.diff].hp);
  const f = { id: foeId++, key, boss: key, def: d, name: d.name, lv: d.lv, hp, maxHp: hp, atk: d.atk * (1 + 0.2 * (d.lv - 1)), spd: d.spd, r: d.r, sc: d.sc, art: d.art, x, y, face: -1, t: 0, st: 0,
    busy: 1.2, walkT: 0, q: [], last: null, hurt: 0, kbx: 0, kby: 0, move: 0, spawnT: 0.01, fly: key === 'vacuum' ? 0 : 0 };
  S.foes.push(f);
  this.current = f;
  fxPuff(x, y - 20, 14);
  return f;
};
function later(f, t, fn) { f.q.push([t, fn]); }
function bw(f, t) { return t * (f.enraged ? 0.82 : 1) * (G.diff === 0 ? 1.15 : G.diff === 2 ? 0.92 : 1); }
function roomClamp(x, y, m) { if (S.scene !== 'dungeon') return { x, y }; const r = Dungeon.room(); m = m || 60; return { x: clamp(x, r.x + 40 + m, r.x + r.w - 40 - m), y: clamp(y, r.y + 70 + m * 0.6, r.y + r.h - 40 - m * 0.6) }; }
function lobTo(f, k, x, y, dur, h) { S.proj.push({ k, from: 'foe', x: f.x, y: f.y - 30, vx: 0, vy: 0, r: 10, dmg: 0, life: dur + 0.1, lob: { t: 0, dur, x0: f.x, y0: f.y - 30, x1: x, y1: y, h: h || 160 } }); }

Bosses.update = function (f, dt) {
  for (let i = f.q.length - 1; i >= 0; i--) { f.q[i][0] -= dt; if (f.q[i][0] <= 0) { const fn = f.q[i][1]; f.q.splice(i, 1); if (f.hp > 0) fn(); } }
  f.move = 0;
  if (!f.enraged && f.hp < f.maxHp * 0.5) { f.enraged = 1; fxText(f.x, f.y - 90, 'Grrr!', '#ff5a6a', true); shake(6); }
  if (f.dashing) {
    const D = f.dashing, sp = D.spd * dt;
    const ox = f.x, oy = f.y;
    moveBody(f, Math.cos(D.a) * sp, Math.sin(D.a) * sp); f.move = 1;
    D.left -= sp;
    if (!D.hit && dist(f.x, f.y, P.x, P.y) < f.r + P.r + 6) { D.hit = 1; heroHurt(D.dmg, f.x, f.y); }
    if (D.left <= 0 || (Math.abs(f.x - ox) + Math.abs(f.y - oy) < sp * 0.3)) { if (D.left > 0) { shake(8); fxPuff(f.x + Math.cos(D.a) * f.r, f.y, 8); } f.dashing = null; }
    if (Math.random() < 0.6) fxPuff(f.x, f.y, 1);
    return;
  }
  if (f.jump) {
    const J = f.jump; J.t += dt;
    if (J.t > J.delay) { const k = clamp((J.t - J.delay) / J.dur, 0, 1); f.x = lerp(J.x0, J.x1, k); f.y = lerp(J.y0, J.y1, k); f.hop = Math.sin(k * Math.PI) * 70; if (k >= 1) { f.jump = null; f.hop = 0; shake(6); fxPuff(f.x, f.y, 8); } }
  }
  if (f.pullTel && S.tele.includes(f.pullTel) && P.state !== 'roll' && inShape(f.pullTel, P.x, P.y, 8)) { const a = angTo(P.x, P.y, f.x, f.y); moveBody(P, Math.cos(a) * 165 * dt, Math.sin(a) * 165 * dt, true); }
  if (!f.jump) f.face = P.x > f.x ? 1 : -1;
  f.busy -= dt;
  if (f.busy > 0 || P.state === 'dead') return;
  if (f.walkT > 0) {
    f.walkT -= dt;
    const d = dist(f.x, f.y, P.x, P.y);
    if (d > 150) { const a = angTo(f.x, f.y, P.x, P.y); moveBody(f, Math.cos(a) * f.spd * 0.7 * dt, Math.sin(a) * f.spd * 0.7 * dt); f.move = 1; }
    return;
  }
  const moves = BOSSES[f.key].moves;
  let m = pick(moves);
  for (let k = 0; k < 4 && m === f.last; k++) m = pick(moves);
  f.last = m;
  f.busy = this.moves[m](f);
  f.walkT = rand(0.45, 1.0) * (f.enraged ? 0.6 : 1);
};

Bosses.moves = {

    for (let i = 0; i < n; i++) later(f, i * 0.14, () => { const p = roomClamp(P.x + rand(-120, 120), P.y + rand(-90, 90), 20); warn({ shape: 'circle', x: p.x, y: p.y, r: 46, dur: bw(f, 1.0), dmg: f.atk, boom: '#b5773e' }); lobTo(f, 'acorn', p.x, p.y, bw(f, 1.0)); });
    return n * 0.14 + 1.0;
  },
  tailSpin(f) { warn({ shape: 'circle', x: f.x, y: f.y, r: 140, dur: bw(f, 1.0), dmg: f.atk * 1.3, src: f, follow: f, boom: '#ffffff' }); later(f, bw(f, 1.0), () => { shake(5); Sfx.play('swipe'); }); return 1.5; },
  charge(f) {

    warn({ shape: 'rect', x: f.x, y: f.y, a, len, w: 84, dur: bw(f, 0.85), noHit: 1, src: f, onDone: () => { f.dashing = { a, left: len, spd: 980, dmg: f.atk * 1.3, hit: 0 }; Sfx.play('roll'); } });

    fxText(f.x, f.y - 100, BOSSES[f.key].summon === 'squirrel' ? 'Get them, my nuts!' : 'Minions!', '#ffffff');

  cannons(f) {

  },
  sweep(f) {

    if (f.enraged) later(f, 0.9, () => warn({ shape: 'cone', x: f.x, y: f.y, a: angTo(f.x, f.y, P.x, P.y), r: 185, half: 1.2, dur: bw(f, 0.6), dmg: f.atk * 1.3, src: f }));

  anchor(f) {

    const a = angTo(f.x, f.y, P.x, P.y), d = bw(f, 1.6);

    later(f, d, () => { f.pullTel = null; warn({ shape: 'circle', x: f.x + Math.cos(a) * 70, y: f.y + Math.sin(a) * 70, r: 105, dur: 0.35, dmg: f.atk * 1.4, src: f }); });
    Sfx.play('vacuum');
    return d + 0.8;
  },
  dustbunnies(f) {
    const spray = (o) => { for (let i = 0; i < 12; i++) { const a = o + (i / 12) * TAU; S.proj.push({ k: 'dust', from: 'foe', x: f.x, y: f.y - 30, vx: Math.cos(a) * 290, vy: Math.sin(a) * 290, r: 11, dmg: f.atk * 0.8, life: 2.6 }); } };
    warn({ shape: 'circle', x: f.x, y: f.y, r: 80, dur: 0.6, noHit: 1, src: f, follow: f, onDone: () => spray(rand(0, TAU)) });

  bigslam(f) {

};

Bosses.defeated = function (f) {
  S.tele.length = 0;
  S.proj = S.proj.filter((p) => p.from === 'hero');
  for (const m of S.foes) if (!m.boss && m.hp > 0) { m.hp = 0; m.dead = 0.0001; fxPuff(m.x, m.y, 6); }
  shake(16); Sfx.play('bossdown');
  fxBurst(f.x, f.y - 30, '#ffd84d', 40, 380); fxRing(f.x, f.y - 20, '#ffffff', 220, 0.8);
  S.slowmo = 0.25;
  setTimeout(() => (S.slowmo = 1), 700);

// ---- 08_dungeon.js
// Dungeons: a row of rooms joined by short halls. Doors lock while a room is being fought.
const RW = 1040, RH = 680, GAP = 230, DOOR = 132, WALL = 40, TOPW = 78;
const Dungeon = { D: null };

Dungeon.enter = function (id) {
  const def = DUNGEONS[id], th = THEMES[def.theme];
  const cleared = !!G.cleared[id];
  const rng = mulberry32(id.length * 97 + 13);
  const rooms = def.rooms.map((rd, i) => {
    const big = !!rd.boss, w = big ? 1300 : RW, h = big ? 820 : RH;
    const x = i === 0 ? 0 : 0, room = { i, w, h, x: 0, y: 0, def: rd, cleared: cleared || (!rd.w && !rd.boss), started: false, wave: 0, obst: [], pots: [], chest: null };
    return room;
  });
  // place rooms left to right, centred on one line
  let x = 0;
  for (const r of rooms) { r.x = x; r.y = -r.h / 2; x += r.w + GAP; }
  for (const r of rooms) {
    // pillars, mirrored so rooms look tidy
    if (!r.def.boss) {
      let kind = rng();
      if (r.def.chest && kind >= 0.35) kind = kind < 0.6 ? 0.1 : 0.9;   // keep the middle clear for the chest
      const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 20;
      if (kind < 0.35) for (const [dx, dy] of [[-260, -130], [260, -130], [-260, 150], [260, 150]]) r.obst.push({ x: cx + dx, y: cy + dy, r: 30 });
      else if (kind < 0.65) for (const [dx, dy] of [[-170, 0], [170, 0]]) r.obst.push({ x: cx + dx, y: cy + dy, r: 34 });
      else if (kind < 0.85) r.obst.push({ x: cx, y: cy, r: 44 });
      for (let k = 0; k < 4; k++) { const px = r.x + 90 + rng() * (r.w - 180), py = r.y + TOPW + 50 + rng() * (r.h - TOPW - 110); if (r.obst.some((o) => dist(o.x, o.y, px, py) < 80)) continue; if (r.def.chest && dist(px, py, r.x + r.w / 2, r.y + r.h / 2 - 40) < 110) continue; if (Math.abs(py - (r.y + r.h / 2)) < 90 && (px < r.x + 160 || px > r.x + r.w - 160)) continue; r.pots.push({ x: px, y: py, hp: 1, v: (rng() * 3) | 0 }); }
    }
    if (r.def.chest) r.chest = { x: r.x + r.w / 2, y: r.y + r.h / 2 - 40, id: id + ':' + r.i, item: r.def.chest, open: !!G.chests[id + ':' + r.i] };
  }
  this.D = { id, def, th, rooms, cur: 0, locked: false, exit: cleared && rooms[rooms.length - 1].def.boss ? { x: rooms[rooms.length - 1].x + rooms[rooms.length - 1].w / 2, y: rooms[rooms.length - 1].y + rooms[rooms.length - 1].h / 2 + 120 } : null, t: 0 };
  this.cache = {};
  S.scene = 'dungeon'; S.dun = this.D;
  S.foes.length = 0; S.proj.length = 0; S.tele.length = 0; S.clouds.length = 0; S.picks.length = 0;
  const r0 = rooms[0];
  P.x = r0.x + 80; P.y = r0.y + r0.h / 2 + 20; P.face = 1; P.state = 'idle';
  Cam.x = P.x; Cam.y = P.y;
  UI.areaName(def.name);
  Music.play(def.main ? 'dungeon' : 'cave');
};

Dungeon.leave = function (dead) {
  const s = DUNGEON_SPOTS[this.D.id];
  S.scene = 'world'; S.dun = null; this.D = null;
  S.foes.length = 0; S.proj.length = 0; S.tele.length = 0; S.clouds.length = 0; S.picks.length = 0;
  for (const pk of Packs.list) { pk.alive = []; pk.spawned = 0; }
  if (!dead) { P.x = s.x; P.y = s.y + 60; Cam.x = P.x; Cam.y = P.y; }
  Bosses.current = null;
  Music.play(Game.regionMusic());
  Game.save();
};

Dungeon.room = function () { return this.D.rooms[this.D.cur]; };
Dungeon.roomAt = function (x) { for (const r of this.D.rooms) if (x >= r.x - GAP / 2 && x < r.x + r.w + GAP / 2) return r; return null; };

// walls, halls, pillars and doors
Dungeon.blocked = function (x, y, r, b) {
  const D = this.D; if (!D) return false;
  r = r || 0;
  for (let i = 0; i < D.rooms.length; i++) {
    const R = D.rooms[i];
    const ix0 = R.x + WALL, ix1 = R.x + R.w - WALL, iy0 = R.y + TOPW, iy1 = R.y + R.h - WALL;
    if (y - r * 0.6 >= iy0 && y + r * 0.4 <= iy1 && x - r >= ix0 && x + r <= ix1) {
      for (const o of R.obst) if (dist2(x, y, o.x, o.y) < (o.r + r) * (o.r + r)) return true;
      for (const p of R.pots) if (p.hp > 0 && dist2(x, y, p.x, p.y) < (14 + r) * (14 + r)) return true;
      if (R.chest && (R.cleared || R.chest.open) && dist2(x, y, R.chest.x, R.chest.y) < (26 + r) * (26 + r)) return true;
      return false;
    }
    const cy = R.y + R.h / 2, dy0 = cy - DOOR / 2 + 10, dy1 = cy + DOOR / 2 + 10;
    if (!(y - r * 0.6 >= dy0 && y + r * 0.4 <= dy1)) continue;
    const lockedHere = D.locked && D.cur === i;
    // right: the doorway and the hall to the next room
    if (i < D.rooms.length - 1 && x >= ix1 - r - 1 && x <= R.x + R.w + GAP) return lockedHere && x + r > ix1;
    // left: the doorway (the first room's leads back outside)
    if (x <= ix0 + r + 1 && x >= R.x - (i === 0 ? 70 : 0)) return lockedHere && x - r < ix0;
  }
  return true;
};
Dungeon.losClear = function (x0, y0, x1, y1) { const n = Math.ceil(dist(x0, y0, x1, y1) / 16); for (let i = 1; i < n; i++) { const t = i / n; if (this.blocked(lerp(x0, x1, t), lerp(y0, y1, t), 0)) return false; } return true; };

Dungeon.update = function (dt) {
  const D = this.D; if (!D) return;
  D.t += dt;
  const r = this.roomAt(P.x);
  if (r) D.cur = r.i;
  const R = this.room();
  // stepping into an unfought room starts it
  if (!R.cleared && !R.started && P.x > R.x + WALL + 70 && P.x < R.x + R.w - WALL - 70) {
    R.started = true; D.locked = true; Sfx.play('lock');
    if (R.def.boss) {
      const bk = D.def.boss;
      const lines = BOSS_LINES[bk] && BOSS_LINES[bk].intro;
      const bx = R.x + R.w - 300, by = R.y + R.h / 2 + 30;
      Bosses.spawn(bk, bx, by);
      Music.play('boss');
      if (lines) Dialog.play(lines);
    } else this.spawnWave(R, R.def.w);
  }
  if (R.started && !R.cleared && !R.def.boss) {
    if (R.pending > 0) { R.pending -= dt; if (R.pending <= 0) this.spawnWave(R, R.def.w2); }
    else if (!S.foes.some((f) => f.hp > 0 && !f.gone)) {
      if (R.def.w2 && R.wave === 1) { R.wave = 2; R.pending = 0.7; }
      else this.roomCleared(R);
    }
  }
  // stepping onto the exit
  if (D.exit && dist(P.x, P.y, D.exit.x, D.exit.y) < 40 && !D.exitUsed) { D.exitUsed = 1; Game.fade(() => this.leave()); }
  // leaving by the front door
  if (P.x < D.rooms[0].x + 18 && !D.leaving) { D.leaving = 1; Game.fade(() => this.leave()); }
};
Dungeon.spawnWave = function (R, list) {
  const D = this.D, lv = D.def.lv;
  let i = 0;
  for (const [k, n] of list) for (let j = 0; j < n; j++) {
    const a = (i++ / 6) * TAU + rand(-0.3, 0.3);
    let x = R.x + R.w * 0.6 + Math.cos(a) * rand(120, 260), y = R.y + R.h / 2 + 30 + Math.sin(a) * rand(80, 180);
    const p = roomClamp(x, y, 40);
    if (this.blocked(p.x, p.y, 18)) { p.x = R.x + R.w / 2 + rand(-60, 60); p.y = R.y + R.h / 2 + rand(-40, 60); }
    addFoe(makeFoe(k, clamp(lv + randi(-1, 1), 1, 30), p.x, p.y, { aggro: 1 }));
  }
  R.wave = Math.max(R.wave, 1);
};
Dungeon.roomCleared = function (R) {
  R.cleared = true; this.D.locked = false;
  Sfx.play('unlock');
  if (R.chest && !R.chest.open) UI.toast('A chest appeared!');
  else if (R.i < this.D.rooms.length - 1) UI.toast('The way is open!');
  else if (!R.def.boss) { this.finish(); }
};
Dungeon.finish = function () {
  const D = this.D, last = D.rooms[D.rooms.length - 1];
  if (!G.cleared[D.id]) { G.cleared[D.id] = 1; Quests.onDungeon(D.id); }
  D.exit = { x: last.x + last.w / 2, y: last.y + last.h / 2 + 140 };
  UI.toast(D.def.name + ' cleared!');
  Game.save();
};
Dungeon.bossBeaten = function (key) {
  const D = this.D; if (!D) return;
  const R = this.room(); R.cleared = true; D.locked = false;
  G.pieces = Math.max(G.pieces, { nutsworth: 1, whiskers: 2, snowball: 3, cleocatra: 4 }[key] || G.pieces);
  if (key !== 'mittens') UI.banner('GOLDEN PIECE!', G.pieces + ' of 4 found');
  else { G.flags.gleam = 1; UI.banner('THE GLEAM!', 'The heart of the Golden Ball'); }
  Music.play('dungeon');
  this.finish();
};
// swinging at pots
Dungeon.swingAt = function (x, y, r) {
  const R = this.room(); if (!R) return;
  for (const p of R.pots) if (p.hp > 0 && dist(x, y, p.x, p.y) < r * 0.7 + 14) {
    p.hp = 0; Sfx.play('pot'); fxBurst(p.x, p.y - 14, '#c98a58', 12, 200);
    const roll = Math.random();
    if (roll < 0.25 && G.hp < maxHp()) S.picks.push({ k: 'heart', x: p.x, y: p.y - 10, vx: rand(-40, 40), vy: -160, z: 0, t: 0, delay: 0.3 });
    else if (roll < 0.75) for (let i = 0; i < 3; i++) S.picks.push({ k: 'coin', x: p.x, y: p.y - 10, vx: rand(-100, 100), vy: rand(-200, -120), z: 0, val: 1 + Math.floor(this.D.def.lv / 3), t: 0, delay: 0.35 });
  }
};
Dungeon.inters = function (out) {
  const D = this.D; if (!D) return out;
  const R = this.room();
  if (R.chest && R.cleared && !R.chest.open) out.push({ kind: 'dchest', x: R.chest.x, y: R.chest.y + 30, r: 60, chest: R.chest });
  return out;
};

// ---------- drawing
Dungeon.roomCanvas = function (R) {
  const key = R.i;
  if (this.cache[key]) return this.cache[key];
  const th = this.D.th, c = mkCanvas(R.w + 2, R.h + 2), g = c.getContext('2d');
  g.lineJoin = 'round';
  // floor tiles
  g.fillStyle = th.floor; g.fillRect(0, 0, R.w, R.h);
  const T = 52, rng = mulberry32(R.i * 31 + 7);
  for (let y = TOPW; y < R.h; y += T) for (let x = WALL; x < R.w; x += T) {
    g.fillStyle = rng() < 0.5 ? th.floor2 : shade(th.floor, rng() * 0.06 - 0.03);
    g.beginPath(); rrect(g, x + 3, y + 3, T - 6, T - 6, 9); g.fill();
  }
  if (th.name === 'dirt' || th.name === 'sand') { g.fillStyle = shade(th.floor, -0.06); for (let i = 0; i < 40; i++) { ell(g, rng() * R.w, TOPW + rng() * (R.h - TOPW), 6 + rng() * 10, 3 + rng() * 4); g.fill(); } }
  // walls
  const wall = th.wall;
  g.fillStyle = shade(wall, -0.15); g.fillRect(0, 0, R.w, TOPW);
  g.fillStyle = wall; g.fillRect(0, 0, R.w, TOPW - 22);
  g.fillStyle = shade(wall, 0.12); for (let x = 0; x < R.w; x += 46) { g.beginPath(); rrect(g, x + 4, 8, 38, 18, 5); g.fill(); g.beginPath(); rrect(g, x + 27, 32, 38, 18, 5); g.fill(); }
  g.fillStyle = th.top; g.fillRect(0, 0, R.w, 8);
  g.fillStyle = wall; g.fillRect(0, 0, WALL, R.h); g.fillRect(R.w - WALL, 0, WALL, R.h); g.fillRect(0, R.h - WALL, R.w, WALL);
  g.fillStyle = shade(wall, 0.1); g.fillRect(0, R.h - WALL, R.w, 6);
  // door gaps
  const cy = R.h / 2;
  g.fillStyle = th.floor2;
  if (R.i > 0 || true) g.fillRect(0, cy - DOOR / 2 + 10, WALL, DOOR);
  if (R.i < this.D.rooms.length - 1) g.fillRect(R.w - WALL, cy - DOOR / 2 + 10, WALL, DOOR);
  g.strokeStyle = OUT; g.lineWidth = 3; g.strokeRect(WALL, TOPW, R.w - WALL * 2, R.h - TOPW - WALL);
  // a few theme details on the wall
  for (let x = 120; x < R.w - 80; x += 260) {
    if (th.name === 'wood' || this.D.def.theme === 'oak') { g.fillStyle = '#5fa24c'; g.beginPath(); g.ellipse(x, TOPW - 8, 26, 10, 0, 0, TAU); g.fill(); }
    if (this.D.def.theme === 'keep') { g.fillStyle = '#c94a7a'; g.beginPath(); g.moveTo(x - 16, 10); g.lineTo(x + 16, 10); g.lineTo(x + 16, 54); g.lineTo(x, 46); g.lineTo(x - 16, 54); g.closePath(); g.fill(); g.lineWidth = 2; g.stroke(); drawFishBone(g, x, 30, 8); }
    if (this.D.def.theme === 'sand') { g.fillStyle = '#3a8fd9'; g.beginPath(); g.ellipse(x, 30, 10, 6, 0, 0, TAU); g.fill(); g.fillStyle = OUT; g.beginPath(); g.ellipse(x, 30, 2.5, 5, 0, 0, TAU); g.fill(); }
    if (this.D.def.theme === 'ice') { g.fillStyle = '#e8f6ff'; for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(x + k * 12 - 5, TOPW - 22); g.lineTo(x + k * 12, TOPW - 2 + Math.abs(k) * -4); g.lineTo(x + k * 12 + 5, TOPW - 22); g.fill(); } }
    if (this.D.def.theme === 'grotto') { g.strokeStyle = '#5fb848'; g.lineWidth = 5; g.beginPath(); g.moveTo(x, TOPW - 20); g.quadraticCurveTo(x + 10, TOPW + 20, x - 4, TOPW + 40); g.stroke(); }
  }
  this.cache[key] = c;
  return c;
};

Dungeon.drawFloor = function (c, t) {
  const D = this.D; if (!D) return;
  const v = viewRect(40);
  c.fillStyle = '#2a1a2e'; c.fillRect(v.x0 - 50, v.y0 - 50, v.x1 - v.x0 + 100, v.y1 - v.y0 + 100);
  for (let i = 0; i < D.rooms.length; i++) {
    const R = D.rooms[i];
    if (R.x > v.x1 || R.x + R.w < v.x0) continue;
    // hall to the next room
    if (i < D.rooms.length - 1) {
      const cy = R.y + R.h / 2;
      c.fillStyle = D.th.floor2; c.fillRect(R.x + R.w - 2, cy - DOOR / 2 + 10, GAP + 4, DOOR);
      c.fillStyle = shade(D.th.wall, -0.15); c.fillRect(R.x + R.w - 2, cy - DOOR / 2 - 20, GAP + 4, 30);
      c.fillStyle = D.th.wall; c.fillRect(R.x + R.w - 2, cy + DOOR / 2 + 10, GAP + 4, 22);
    }
    if (i === 0) { const cy = R.y + R.h / 2; c.fillStyle = D.th.floor2; c.fillRect(R.x - 60, cy - DOOR / 2 + 10, 62, DOOR); c.fillStyle = 'rgba(255,240,200,0.35)'; c.fillRect(R.x - 60, cy - DOOR / 2 + 10, 40, DOOR); }
    c.drawImage(this.roomCanvas(R), R.x, R.y);
    // torches
    for (let x = R.x + 250; x < R.x + R.w - 120; x += 520) {
      const fl = Math.sin(t * 12 + x) * 2;
      c.fillStyle = '#6d4a33'; c.fillRect(x - 4, R.y + 30, 8, 22);
      c.fillStyle = 'rgba(255,200,90,0.25)'; circ(c, x, R.y + 26, 26 + fl); c.fill();
      c.fillStyle = '#ffb33a'; c.beginPath(); c.ellipse(x, R.y + 22, 7, 11 + fl, 0, 0, TAU); c.fill(); c.fillStyle = '#fff1a8'; c.beginPath(); c.ellipse(x, R.y + 25, 3.5, 6, 0, 0, TAU); c.fill();
    }
    // locked doors get bars
    if (D.locked && D.cur === i) {
      const cy = R.y + R.h / 2;
      for (const dx of [R.x + 6, R.x + R.w - WALL + 6]) { if (dx > R.x + 10 && i === D.rooms.length - 1) continue; c.fillStyle = '#6a6a80'; for (let k = 0; k < 5; k++) { c.beginPath(); rrect(c, dx + (k % 2) * 8, cy - DOOR / 2 + 12 + k * 26, 26, 12, 4); } for (let k = 0; k < 4; k++) { c.beginPath(); rrect(c, dx + 2 + k * 7, cy - DOOR / 2 + 10, 6, DOOR, 3); fo(c, '#8a8aa0', 2); } }
    }
    // pillars
    for (const o of R.obst) {
      c.fillStyle = 'rgba(30,20,40,0.25)'; ell(c, o.x, o.y + 6, o.r + 6, o.r * 0.45); c.fill();
    }
    for (const p of R.pots) if (p.hp > 0) {
      c.fillStyle = 'rgba(30,20,40,0.2)'; ell(c, p.x, p.y + 2, 14, 5); c.fill();
    }
  }
  if (D.exit) {
    const e = D.exit, pulse = Math.sin(t * 4) * 4;
    c.fillStyle = 'rgba(255,230,120,0.35)'; ell(c, e.x, e.y, 46 + pulse, 22 + pulse / 2); c.fill();
    c.strokeStyle = '#ffd84d'; c.lineWidth = 3; ell(c, e.x, e.y, 38 + pulse, 18 + pulse / 2); c.stroke();
    drawPaw(c, e.x, e.y - 2, 12, '#ffd84d');
    c.font = '700 14px Fredoka, ui-rounded, sans-serif'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = OUT; c.strokeText('Exit', e.x, e.y - 30); c.fillStyle = '#fff'; c.fillText('Exit', e.x, e.y - 30);
  }
};
// tall things in a room take part in the y-sorted draw
Dungeon.sprites = function (out) {
  const D = this.D; if (!D) return out;
  const v = viewRect(80);
  for (const R of D.rooms) {
    if (R.x > v.x1 || R.x + R.w < v.x0) continue;
    for (const o of R.obst) out.push({ y: o.y, draw: (c) => drawPillar(c, o, D.th) });
    for (const p of R.pots) if (p.hp > 0) out.push({ y: p.y, draw: (c) => drawPot(c, p) });
    if (R.chest && (R.cleared || R.chest.open)) out.push({ y: R.chest.y, draw: (c) => drawChest(c, R.chest.x, R.chest.y, R.chest.open, 1) });
  }
  return out;
};
function drawPillar(c, o, th) {
  c.save(); c.translate(o.x, o.y);
  const r = o.r;
  c.beginPath(); c.rect(-r * 0.75, -r * 2.6, r * 1.5, r * 2.6); fo(c, shade(th.wall, 0.25));
  c.fillStyle = shade(th.wall, 0.4); c.fillRect(-r * 0.75 + 3, -r * 2.6 + 3, r * 0.4, r * 2.6 - 6);
  c.beginPath(); c.ellipse(0, 0, r, r * 0.42, 0, 0, Math.PI); c.lineTo(-r, -6); c.ellipse(0, -6, r, r * 0.42, 0, Math.PI, 0, true); c.closePath(); fo(c, shade(th.wall, 0.1));
  c.beginPath(); rrect(c, -r, -r * 2.6 - 12, r * 2, 16, 5); fo(c, shade(th.wall, 0.3));
  c.restore();
}
function drawPot(c, p) {

// ---- 09_quests.js
// Quests, talking, treasure, and the fog on the map.
const Quests = {};
Quests.step = function () { return MAIN[G.main]; };
Quests.done = function (stepId) { return G.main > MAIN_INDEX[stepId]; };
Quests.begin = function () {
  const s = this.step(); if (!s) return;
  G.mainN = 0;
  const after = () => {
    UI.toast('New goal: ' + s.text, 'goal');
    if (s.hint === 'move') UI.controlsHint();
  };
  if (s.start) Dialog.play(s.start, after); else after();
};
Quests.advance = function (silent) {
  const s = this.step(); if (!s) return;
  if (s.flag) G.flags[s.flag] = 1;
  if (s.flag2) G.flags[s.flag2] = 1;
  if (s.learnSwim) { UI.banner('DOGGY PADDLE!', 'You can swim in shallow water'); }
  if (s.reward) this.reward(s.reward);
  G.main++;
  G.ch = this.chapter();
  if (s.ending) { G.won = 1; Game.save(); UI.showEnding(); return; }
  Game.save();
  if (!silent) setTimeout(() => this.begin(), 250);
};
Quests.chapter = function () {
  const i = G.main;
  if (i <= MAIN_INDEX.queen) return 'Chapter 1: Bonk!';
  if (i <= MAIN_INDEX.piece1) return 'Chapter 2: Gone Nuts';
  if (i <= MAIN_INDEX.piece2) return 'Chapter 3: Sea Dogs';
  if (i <= MAIN_INDEX.piece3) return 'Chapter 4: Cold Paws';
  if (i <= MAIN_INDEX.piece4) return 'Chapter 5: It\'s a Wrap';
  if (i < MAIN.length) return 'Chapter 6: Bad Kitty';
  return 'The End (but keep exploring!)';
};
Quests.reward = function (r) {
  const bits = [];
  if (r.gold) { giveGold(r.gold); bits.push(r.gold + ' gold'); Sfx.play('coin'); }
  if (r.xp) { giveXp(r.xp); bits.push(r.xp + ' XP'); }
  if (r.item) giveItem(r.item);
  if (bits.length) UI.toast('Reward: ' + bits.join(', '), 'reward');
};

// ---------- counting things
function inRegion(f, reg) { return !reg || World.biomeAt(f.x, f.y) === reg; }
Quests.onKill = function (f) {
  const s = this.step();
  if (s && s.type === 'kill' && s.foes.includes(f.key) && inRegion(f, s.region)) {
    G.mainN++;
    if (G.mainN >= s.n) { this.advance(); } else UI.toast(`${s.text}: ${G.mainN}/${s.n}`, 'count');
  }
  for (const id in G.side) {
    const q = G.side[id], d = SIDE[id];
    if (q.s !== 'active' || d.type !== 'kill' || !d.foes.includes(f.key) || !inRegion(f, d.region)) continue;
    q.n++;
    if (q.n >= d.n) { q.s = 'ready'; UI.toast(`${d.title}: done! Go see ${NPCS[d.giver].name}.`, 'goal'); Sfx.play('quest'); }
    else UI.toast(`${d.title}: ${q.n}/${d.n}`, 'count');
  }
};
Quests.onDungeon = function (id) {
  const s = this.step();
  if (s && s.type === 'dungeon' && s.dungeon === id) this.advance();
  const q = G.side.burrows;
  if (q && q.s === 'active' && id.startsWith('b_')) { q.n++; if (q.n >= SIDE.burrows.n) { q.s = 'ready'; UI.toast('Burrow Busters: done! Go see Ranger Rosie.', 'goal'); } else UI.toast(`Burrow Busters: ${q.n}/${SIDE.burrows.n}`, 'count'); }
};
Quests.onBounty = function (f) {
  const b = BOUNTIES[f.bounty]; if (!b || G.bounty[f.bounty] !== 'active') return;
  G.bounty[f.bounty] = 'done';
  UI.banner('BOUNTY COMPLETE!', b.name);
  this.reward({ gold: b.gold, xp: b.xp });
  Sfx.play('quest');
  if (G.track === f.bounty) G.track = 'main';
};
Quests.onPickup = function (qid, item) {
  if (qid === 'main') {
    const s = this.step();
    if (s && s.type === 'collect') { G.mainN++; UI.toast(`${QITEMS[item].name}: ${G.mainN}/${s.n}`, 'count'); if (G.mainN >= s.n) this.advance(); }
    return;
  }
  const q = G.side[qid], d = SIDE[qid];
  if (!q || q.s !== 'active') return;
  q.n++;
  if (q.n >= d.n) { q.s = 'ready'; UI.toast(`${d.title}: done! Go see ${NPCS[d.giver].name}.`, 'goal'); Sfx.play('quest'); } else UI.toast(`${QITEMS[item].name}: ${q.n}/${d.n}`, 'count');
};
Quests.onDig = function () {
  const q = G.side.dig;
  if (q && q.s === 'active') { q.n++; if (q.n >= SIDE.dig.n) { q.s = 'ready'; UI.toast('Dig It: done! Go see Grandpa Gravy.', 'goal'); } else UI.toast(`Dig It: ${q.n}/${SIDE.dig.n}`, 'count'); }
};
Quests.checkGoto = function () {
  const s = this.step();
  if (s && s.type === 'goto' && S.scene === 'world' && World.townAt(P.x, P.y) === s.town) this.advance();
};

// ---------- talking to folk
Quests.sideAvailable = function (id) {
  const d = SIDE[id];
  if (G.side[id]) return false;
  if (d.needStep && !this.done(d.needStep)) return false;
  return true;
};
Quests.npcMark = function (npc) {
  const s = this.step();
  if (s && (s.type === 'talk' || s.type === 'learn') && s.npc === npc && !(s.type === 'learn' && G.tricks[s.trick])) return '!';
  for (const id in SIDE) {
    const d = SIDE[id], q = G.side[id];
    if (d.giver === npc && q && q.s === 'ready') return '?';
    if (d.giver === npc && this.sideAvailable(id)) return '!';
    if (q && q.s === 'active' && d.type === 'deliver' && d.npcs.includes(npc) && !q.got[npc]) return '?';
  }
  return null;
};
Quests.talk = function (npc) {
  const n = NPCS[npc], s = this.step();
  G.met[npc] = 1;
  Sfx.play('bark');
  // the main story first
  if (s && s.type === 'talk' && s.npc === npc) return Dialog.play(s.talk, () => this.advance());
  if (s && s.type === 'learn' && s.npc === npc) return Dialog.play(s.talk, () => { this.learnTrick(s.trick, true); this.advance(); });
  // deliveries
  for (const id in G.side) {
    const q = G.side[id], d = SIDE[id];
    if (q.s === 'active' && d.type === 'deliver' && d.npcs.includes(npc) && !q.got[npc]) {
      return Dialog.play(d.lines[npc], () => {
        q.got[npc] = 1; q.n = Object.keys(q.got).length;
        if (q.n >= d.npcs.length) { q.s = 'ready'; UI.toast(`${d.title}: done! Go see ${NPCS[d.giver].name}.`, 'goal'); } else UI.toast(`${d.title}: ${q.n}/${d.npcs.length} letters`, 'count');
      });
    }
  }
  // side quests this one gives
  for (const id in SIDE) {
    const d = SIDE[id], q = G.side[id];
    if (d.giver !== npc) continue;
    if (q && q.s === 'ready') return Dialog.play(d.turnin, () => { q.s = 'done'; this.reward(d.reward); Sfx.play('quest'); if (G.track === id) G.track = 'main'; Game.save(); });
    if (this.sideAvailable(id)) {
      return Dialog.ask(d.offer, [
        { label: 'Sure, I\'ll help!', fn: () => { G.side[id] = { s: 'active', n: 0, got: {} }; G.track = id; UI.toast('New side quest: ' + d.title, 'goal'); Sfx.play('quest'); } },
        { label: 'Maybe later', fn: () => {} },
      ]);
    }
    if (q && q.s === 'active') return Dialog.play([[npc, 'How\'s it going? ' + d.text + '.']]);
  }
  // shops and services
  if (n.role === 'trainer') return Dialog.play([[npc, pick(n.talk).replace('{name}', G.hero.name)]], () => UI.openTrainer(n.town));
  if (n.role === 'smith') return Dialog.play([[npc, pick(n.talk)]], () => UI.openShop(n.town));
  if (n.role === 'inn') return Interact.inn(n.town, npc);
  if (npc === 'paddle' || npc === 'ferry2') return Interact.ferry(npc === 'paddle' ? World.dock : World.dock2);
  // just chatting
  const lines = n.talk || ['Woof!'];
  n.ti = ((n.ti || 0) + 1) % lines.length;
  Dialog.play([[npc, lines[n.ti]]]);
};
Quests.learnTrick = function (id, free) {
  if (!G.tricks[id]) {
    G.tricks[id] = 1;
    const empty = G.slots.indexOf(null);
    if (empty >= 0) G.slots[empty] = id;
    UI.banner('NEW TRICK!', TRICKS[id].name);
    Sfx.play('level');
  }
};

// ---------- where is the goal? (for the pointer and the map)
Quests.npcPos = function (id) { const n = S.npcs.find((q) => q.id === id); return n ? { x: n.x, y: n.y } : null; };
Quests.target = function () {
  const tr = G.track || 'main';
  if (tr === 'main') {
    const s = this.step(); if (!s) return null;
    switch (s.type) {
      case 'talk': case 'learn': return Object.assign({ label: NPCS[s.npc].name }, this.npcPos(s.npc));
      case 'kill': if (s.spawn) { const t = TOWNS[s.spawn.town]; return { x: t.x + s.spawn.dx, y: t.y + s.spawn.dy, label: s.text }; } return null;
      case 'dungeon': return S.scene === 'dungeon' ? null : Object.assign({ label: DUNGEONS[s.dungeon].name }, DUNGEON_SPOTS[s.dungeon]);
      case 'goto': if (G.flags.ferry && World.townAt(P.x, P.y) !== 'fetchwick' && World.biomeAt(P.x, P.y) !== 'isle') return { x: World.dock.x, y: World.dock.y, label: 'Fetchwick docks' }; return { x: TOWNS[s.town].x, y: TOWNS[s.town].y, label: TOWNS[s.town].name };
      case 'collect': { const sp = this.spots('main').filter((q) => !q.got); if (!sp.length) return null; sp.sort((a, b) => dist2(P.x, P.y, a.x, a.y) - dist2(P.x, P.y, b.x, b.y)); return { x: sp[0].x, y: sp[0].y, label: s.text }; }
    }
    return null;
  }
  if (BOUNTIES[tr]) { const b = BOUNTIES[tr]; return G.bounty[tr] === 'active' ? { x: b.at[0], y: b.at[1], label: b.name } : null; }
  const q = G.side[tr], d = SIDE[tr];
  if (!q || !d) return null;
  if (q.s === 'ready') return Object.assign({ label: NPCS[d.giver].name }, this.npcPos(d.giver));
  if (d.type === 'deliver') { const left = d.npcs.filter((n) => !q.got[n]).map((n) => Object.assign({ label: NPCS[n].name }, this.npcPos(n))); left.sort((a, b) => dist2(P.x, P.y, a.x, a.y) - dist2(P.x, P.y, b.x, b.y)); return left[0] || null; }
  if (d.type === 'collect') { const sp = this.spots(tr).filter((s) => !s.got); sp.sort((a, b) => dist2(P.x, P.y, a.x, a.y) - dist2(P.x, P.y, b.x, b.y)); return sp[0] ? { x: sp[0].x, y: sp[0].y, label: d.text } : null; }
  if (d.region) { const r = REGIONS.find((x) => x.id === d.region); return r ? { x: r.x, y: r.y, label: BIOMES[d.region].name, area: 1 } : null; }
  return null;
};
Quests.trackText = function () {
  const tr = G.track || 'main';
  if (tr === 'main') { const s = this.step(); if (!s) return G.won ? { title: 'Barkadia is saved!', text: 'Dig, explore and catch bounties' } : null; let t = s.text; if (s.n) t += ` (${G.mainN}/${s.n})`; return { title: this.chapter(), text: t }; }
  if (BOUNTIES[tr]) return { title: BOUNTIES[tr].title, text: 'Find and beat ' + BOUNTIES[tr].name };
  const q = G.side[tr], d = SIDE[tr];
  if (!q) return null;
  if (q.s === 'ready') return { title: d.title, text: 'Go see ' + NPCS[d.giver].name };
  const n = d.n || (d.npcs && d.npcs.length);
  return { title: d.title, text: d.text + (n ? ` (${q.n}/${n})` : '') };
};
// quest things lying on the ground
Quests.spots = function (qid) {
  const d = qid === 'main' ? this.step() : SIDE[qid];
  if (!d || !d.spots) return [];
  return d.spots.map((p, i) => { const key = (qid === 'main' ? d.id : qid) + ':' + i; return { x: p[0], y: p[1], key, got: !!G.picked[key], item: d.item, how: d.how, qid }; });
};
Quests.activeSpots = function () {
  const out = [];
  const s = this.step();
  if (s && s.type === 'collect') out.push(...this.spots('main'));
  for (const id in G.side) if (G.side[id].s === 'active' && SIDE[id].type === 'collect') out.push(...this.spots(id));
  return out.filter((p) => !p.got);
};
Quests.spawnsWanted = function () {
  const out = [];
  const s = this.step();
  if (s && s.type === 'kill' && s.spawn) { const t = TOWNS[s.spawn.town]; out.push({ tag: 'main:' + s.id, x: t.x + s.spawn.dx, y: t.y + s.spawn.dy, foe: s.spawn.foe, n: s.spawn.n, lv: s.spawn.lv }); }
  for (const id in G.bounty) if (G.bounty[id] === 'active') { const b = BOUNTIES[id]; out.push({ tag: 'bounty:' + id, x: b.at[0], y: b.at[1], foe: b.foe, n: 1, lv: b.lv, elite: b.name, bounty: id }); }
  return out;
};

// ---------- interacting with the world
const Interact = { target: null };
Interact.find = function () {
  if (Game.state !== 'play' || P.state === 'dead') { this.target = null; return; }
  const cands = [];
  if (S.scene === 'world') {
    for (const n of S.npcs) cands.push({ kind: 'npc', id: n.id, x: n.x, y: n.y, r: 62, label: 'Talk' });
    for (const it of World.inters) if (it.kind !== 'townname') cands.push(it);
    for (const ch of World.chests) if (!G.chests[ch.id]) cands.push({ kind: 'chest', ch, x: ch.x, y: ch.y + 10, r: 58, label: 'Open' });
    for (const d of World.digs) if (!G.digs[d.id]) cands.push({ kind: 'dig', d, x: d.x, y: d.y, r: 46, label: 'Dig' });
    for (const p of Quests.activeSpots()) if (p.how === 'dig') cands.push({ kind: 'qdig', p, x: p.x, y: p.y, r: 46, label: 'Dig' });
  } else Dungeon.inters(cands);
  let best = null, bd = 1e9;
  for (const c of cands) { const d = dist(P.x, P.y, c.x, c.y); if (d < c.r && d < bd) { bd = d; best = c; } }
  this.target = best;
};
Interact.label = function (it) {
  return it.label || { inn: 'Rest', smith: 'Shop', trainer: 'Tricks', board: 'Read', dock: 'Ferry', dungeon: 'Enter', sign: 'Look', dchest: 'Open', castle: 'Look' }[it.kind] || 'Look';
};
Interact.use = function (it) {
  Input.hit.atk = false;
  switch (it.kind) {
    case 'npc': return Quests.talk(it.id);
    case 'inn': return this.inn(it.town);
    case 'smith': return UI.openShop(it.town);
    case 'trainer': return UI.openTrainer(it.town);
    case 'board': return UI.openBoard(it.town);
    case 'dock': return this.ferry(it.dock);
    case 'castle': return Dialog.play([['sign', 'The royal palace of Barkadia. Queen Corgina holds court right outside, because the inside smells like old carpet.']]);
    case 'sign': {
      const t = { well: 'You peek into the well. A frog peeks back.', fountain: 'A fountain shaped like a very proud dog. You make a wish. It is probably about snacks.', campfire: 'The campfire crackles. Someone roasted a sausage here.' }[it.sub] || SIGNS[it.town] || '...';
      return Dialog.play([['sign', t]]);
    }
    case 'dungeon': return this.door(it.id);
    case 'chest': return this.openChest(it.ch.id, it.ch, it.ch.x, it.ch.y);
    case 'dchest': { const ch = it.chest; ch.open = true; G.chests[ch.id] = 1; Sfx.play('chest'); fxBurst(ch.x, ch.y - 30, '#ffd84d', 18, 220); giveItem(ch.item); Game.save(); const D = Dungeon.D; if (D && !D.def.boss && Dungeon.room().i === D.rooms.length - 1) Dungeon.finish(); return; }
    case 'dig': case 'qdig': P.state = 'digspot'; P.st = 0; this.digging = it; Sfx.play('dig'); return;
  }
};
Interact.finishDig = function () {
  const it = this.digging; this.digging = null; if (!it) return;
  fxBurst(it.x, it.y - 6, '#a87a50', 16, 220);
  if (it.kind === 'qdig') { const p = it.p; G.picked[p.key] = 1; UI.toast('You dug up a ' + QITEMS[p.item].name + '!', 'item'); Sfx.play('chest'); Quests.onPickup(p.qid, p.item); return; }
  const d = it.d; G.digs[d.id] = 1;
  const reg = World.regionAt(d.x, d.y) || REGIONS[0];
  const roll = hash2(d.id, 7, 3);
  if (roll < 0.22) { const pool = ['bone', 'bandana', 'party', 'chicken', 'flower', 'squeaky', 'raincoat', 'sweater', 'wizard', 'sombrero']; giveItem(pool[Math.floor(hash2(d.id, 9, 1) * pool.length)]); }
  else { const g = Math.round((25 + reg.lv[1] * 18) * (0.8 + roll)); giveGold(g); UI.toast(`You dug up ${g} gold!`, 'coin'); Sfx.play('coin'); }
  Quests.onDig();
};
Interact.openChest = function (id, ch, x, y) {
  G.chests[id] = 1; Sfx.play('chest');
  fxBurst(x, y - 30, '#ffd84d', 18, 220);
  if (ch.item) giveItem(ch.item);
  if (ch.gold) { giveGold(ch.gold); UI.toast(`Found ${ch.gold} gold!`, 'coin'); }
  Game.save();
};
Interact.door = function (id) {
  const open = id.startsWith('b_') || (id === 'oak' && G.flags.oak_open) || (id === 'grotto' && G.flags.grotto_open) || (id === 'den' && G.flags.den_open) || (id === 'purramid' && G.flags.purr_open) || (id === 'keep' && G.flags.ferry);
  if (!open) return Dialog.play(LOCKED[id] || [['squeaky', 'It\'s locked.']]);
  const def = DUNGEONS[id];
  const warnLv = def.lv - G.lv >= 3 ? ` The critters in there are around level ${def.lv}. Be careful!` : '';
  Dialog.ask([['narrator', `${def.name}. ${G.cleared[id] ? 'You have cleared it already.' : 'Go inside?'}${warnLv}`]], [
    { label: 'Go in', fn: () => Game.fade(() => Dungeon.enter(id)) },
    { label: 'Not yet', fn: () => {} },
  ]);
};
Interact.inn = function (town, npc) {
  const who = npc || Object.keys(NPCS).find((k) => NPCS[k].town === town && NPCS[k].role === 'inn');
  Dialog.ask([[who || 'narrator', 'Welcome! A nap here fills your health and Woof, and saves your journey. Free for heroes!']], [
    { label: 'Take a nap', fn: () => Game.fade(() => { G.hp = maxHp(); G.mp = maxMp(); G.respawn = town; Game.save(true); UI.toast('You feel well rested. Journey saved!', 'save'); Sfx.play('level'); }) },
    { label: 'No thanks', fn: () => {} },
  ]);
};
Interact.ferry = function (dock) {
  if (!G.flags.ferry) return Dialog.play([['paddle', 'Ahoy! The Royal Ferry only sails with the Queen\'s pass, pup. Rules is rules.']]);
  const toIsle = dock.to === 'isle';
  Dialog.ask([[toIsle ? 'paddle' : 'ferry2', toIsle ? 'All aboard for Scratchpost Isle! It\'s a bit... catty over there.' : 'Ready to head back to Fetchwick?']], [
    { label: 'Set sail!', fn: () => Game.fade(() => { const to = toIsle ? World.dock2 : World.dock; P.x = to.x + (toIsle ? 60 : -60); P.y = to.y + 10; Cam.x = P.x; Cam.y = P.y; Quests.checkGoto(); Music.play(Game.regionMusic()); }, 'Sailing...') },
    { label: 'Stay here', fn: () => {} },
  ]);
};

// treasure placed in the world at the start
World.placeTreasure = function () {
  this.chests = CHESTS.map((c) => { const p = this.toLand(c.x, c.y, 0.08); const q = this.blocked(p.x, p.y, 20, false) ? this.toLand(p.x + 40, p.y + 40, 0.08) : p; return Object.assign({}, c, { x: q.x, y: q.y }); });
  this.digs = DIGS.map(([x, y], i) => { const p = this.toLand(x, y, 0.1); return { id: i + 1, x: p.x, y: p.y }; });

// ---------- the fog over the map, cleared as you explore
const FOGC = 96, FOGW = Math.ceil(WW / FOGC), FOGH = Math.ceil(WH / FOGC);
const Fog = { bits: new Uint8Array(FOGW * FOGH), dirty: true };
Fog.reveal = function (x, y) {
  const R = 7, cx = Math.floor(x / FOGC), cy = Math.floor(y / FOGC);
  if (cx === this.lx && cy === this.ly) return;
  this.lx = cx; this.ly = cy;
  for (let j = -R; j <= R; j++) for (let i = -R; i <= R; i++) {
    if (i * i + j * j > R * R) continue;
    const X = cx + i, Y = cy + j;
    if (X < 0 || Y < 0 || X >= FOGW || Y >= FOGH) continue;
    const k = Y * FOGW + X;
    if (!this.bits[k]) { this.bits[k] = 1; this.dirty = true; }
  }
};
Fog.save = function () { let s = ''; for (let i = 0; i < this.bits.length; i += 8) { let b = 0; for (let k = 0; k < 8; k++) if (this.bits[i + k]) b |= 1 << k; s += String.fromCharCode(b); } return btoa(s); };
Fog.load = function (str) {
  this.bits = new Uint8Array(FOGW * FOGH); this.dirty = true;
  if (!str) return;
  try { const s = atob(str); for (let i = 0; i < s.length; i++) { const b = s.charCodeAt(i); for (let k = 0; k < 8; k++) if (b & (1 << k) && i * 8 + k < this.bits.length) this.bits[i * 8 + k] = 1; } } catch (e) {}
};
Fog.seen = function (x, y) { const X = Math.floor(x / FOGC), Y = Math.floor(y / FOGC); return X >= 0 && Y >= 0 && X < FOGW && Y < FOGH && this.bits[Y * FOGW + X]; };

// ---------- dialogue
const Dialog = { open: false, lines: [], i: 0, shown: 0, done: null, choices: null, speaker: null };
Dialog.play = function (lines, done) { this.ask(lines, null, done); };
Dialog.ask = function (lines, choices, done) {
  if (this.open) { const prev = this.done; this.lines = this.lines.concat(lines); if (choices) this.choices = choices; this.done = () => { prev && prev(); done && done(); }; return; }
  this.open = true; this.lines = lines; this.i = 0; this.choices = choices; this.done = done || null;
  Game.state = 'dialog'; Input.clear();
  $('#dialog').classList.remove('hidden');

};
Dialog.show = function () {
  const [who, text] = this.lines[this.i];
  this.speaker = who; this.full = nm(text); this.shown = 0; this.tBlip = 0;
  const box = $('#dialog .dbox');
  const nameOf = who === 'hero' ? G.hero.name : NPCS[who] ? NPCS[who].name : SPEAKERS[who] != null ? nm(SPEAKERS[who]) : who;
  box.querySelector('.dname').textContent = nameOf || '';
  box.classList.toggle('noport', who === 'narrator' || who === 'sign');
  drawPortrait($('#portrait'), who);
  box.querySelector('.dtext').textContent = '';

  box.querySelector('.dnext').style.visibility = 'hidden';
};
Dialog.update = function (dt) {
  if (!this.open) return;
  if (this.shown < this.full.length) {
    this.shown = Math.min(this.full.length, this.shown + dt * 52);
    $('#dialog .dtext').textContent = this.full.slice(0, Math.floor(this.shown));
    this.tBlip -= dt; if (this.tBlip <= 0) { this.tBlip = 0.07; Sfx.play('talk'); }
    if (this.shown >= this.full.length) this.finishLine();

  if (this.choicesShown) { Nav.update(); return; }
  if (Input.hit.atk || Input.hit.act || Input.hit.roll) this.next();

Dialog.finishLine = function () {
  this.shown = this.full.length;

    const box = $('#dialog .dchoices');
    box.innerHTML = this.choices.map((c, i) => `<button class="btn nav ${i === 0 ? 'gold' : ''}" data-ci="${i}">${esc(c.label)}</button>`).join('');

};

  this.i++;
  if (this.i >= this.lines.length) return this.close();
  this.show();
};
Dialog.pick = function (i) { const c = this.choices[i]; this.choices = null; this.close(); c && c.fn && c.fn(); };

  if (b) { Dialog.pick(+b.dataset.ci); return; }
  if (!Dialog.choicesShown) Dialog.next();

function drawPortrait(cv2, who) {

  if (L) {

// ---------- focus for keyboards and controllers in menus
const Nav = { layer: null, el: null, back: null, tabs: null };
Nav.set = function (layer, back, tabs) { this.layer = layer; this.back = back; this.tabs = tabs; this.el = null; this.pickFirst(); };

Nav.focus = function (el) {

};
Nav.move = function (dx, dy) {
  const it = this.items(); if (!it.length) return;
  if (!this.el || !it.includes(this.el)) return this.focus(it[0]);
  const a = this.el.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = 1e9;
  for (const e of it) {
    if (e === this.el) continue;
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    const ddx = bx - ax, ddy = by - ay;

};
Nav.update = function () {

  const H = Input.hit;
  if (H.up) this.move(0, -1); if (H.down) this.move(0, 1); if (H.left) this.move(-1, 0); if (H.right) this.move(1, 0);
  if ((H.atk || H.act) && this.el) { if (!this.el.classList.contains('focus')) this.focus(this.el); this.el.click(); }
  if ((H.roll || H.back || H.menu) && this.back) this.back();
  if (this.tabs && (H.lb || H.rb)) this.tabs(H.lb ? -1 : 1);

// ---------- the map
const MapView = {};
MapView.base = function () {
  if (this.img) return this.img;
  const s = 16, w = WW / s, h = WH / s, c = mkCanvas(w, h), g = c.getContext('2d'), d = g.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const x = i * s, y = j * s, f = World.Fat(x, y), k = (j * w + i) * 4;
    let r, gg, b;
    if (f < 0) { const t = clamp(-f / 0.55, 0, 1); r = lerp(150, 70, t); gg = lerp(220, 150, t); b = lerp(240, 220, t); }
    else { const kk = Math.round(y / GS) * GW + Math.round(x / GS); r = World.CR[kk]; gg = World.CG[kk]; b = World.CB[kk]; if (f < 0.05) { const sd = SANDS[World.biomeAt(x, y)]; r = sd[0]; gg = sd[1]; b = sd[2]; } }
    d.data[k] = r; d.data[k + 1] = gg; d.data[k + 2] = b; d.data[k + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  g.strokeStyle = '#d9b77f'; g.lineWidth = 2; g.lineJoin = 'round';
  for (const p of World.roadPolys) { g.beginPath(); p.forEach((q, i) => (i ? g.lineTo(q[0] / s, q[1] / s) : g.moveTo(q[0] / s, q[1] / s))); g.stroke(); }
  for (const p of World.props) if (p.kind === 'mountain') { g.fillStyle = '#8c96b5'; g.beginPath(); g.moveTo(p.x / s - 7, p.y / s); g.lineTo(p.x / s, p.y / s - 10); g.lineTo(p.x / s + 7, p.y / s); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.moveTo(p.x / s - 2.5, p.y / s - 6.5); g.lineTo(p.x / s, p.y / s - 10); g.lineTo(p.x / s + 2.5, p.y / s - 6.5); g.fill(); }
  else if (p.kind === 'tree' || p.kind === 'pine' || p.kind === 'dead' || p.kind === 'palm') { g.fillStyle = 'rgba(40,90,40,0.35)'; g.fillRect(p.x / s - 1, p.y / s - 2, 2.5, 2.5); }
  this.img = c;
  return c;
};
MapView.draw = function (cv2) {
  if (!cv2) return;
  const r = cv2.getBoundingClientRect();
  const W = Math.max(200, r.width), H = Math.max(160, r.height);
  cv2.width = W * DPR; cv2.height = H * DPR;
  const g = cv2.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const k = Math.min(W / WW, H / WH), ox = (W - WW * k) / 2, oy = (H - WH * k) / 2;
  g.fillStyle = '#3b94dd'; g.fillRect(0, 0, W, H);
  g.imageSmoothingEnabled = true;
  g.drawImage(this.base(), ox, oy, WW * k, WH * k);
  // fog: parchment clouds over places not seen
  g.fillStyle = '#efe0bd';
  const cw = FOGC * k + 1;
  for (let j = 0; j < FOGH; j++) for (let i = 0; i < FOGW; i++) if (!Fog.bits[j * FOGW + i]) g.fillRect(ox + i * FOGC * k - 0.5, oy + j * FOGC * k - 0.5, cw, cw);
  g.font = `700 ${Math.max(11, 13 * k * 9)}px Fredoka, ui-rounded, sans-serif`; g.textAlign = 'center';
  const label = (txt, x, y, col) => { g.lineWidth = 3.5; g.strokeStyle = OUT; g.strokeText(txt, x, y); g.fillStyle = col || '#fff'; g.fillText(txt, x, y); };
  for (const id in TOWNS) { const T = TOWNS[id]; if (!Fog.seen(T.x, T.y)) continue; const x = ox + T.x * k, y = oy + T.y * k; g.fillStyle = '#ffd84d'; g.strokeStyle = OUT; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill(); g.stroke(); label(T.name, x, y - 9); }
  for (const id in DUNGEON_SPOTS) { const D = DUNGEON_SPOTS[id]; if (!Fog.seen(D.x, D.y)) continue; const x = ox + D.x * k, y = oy + D.y * k; g.fillStyle = G.cleared[id] ? '#9be07a' : DUNGEONS[id].main ? '#e8475f' : '#a87a50'; g.strokeStyle = OUT; g.lineWidth = 2; g.beginPath(); rrect(g, x - 5, y - 5, 10, 10, 2); g.fill(); g.stroke(); if (DUNGEONS[id].main) label(DUNGEONS[id].name, x, y + 18, '#ffe0e4'); }
  const t = Quests.target();
  if (t && t.x != null) { const x = ox + t.x * k, y = oy + t.y * k, p = 7 + Math.sin(S.time * 5) * 2; g.strokeStyle = '#ffd84d'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, p + 4, 0, TAU); g.stroke(); g.fillStyle = '#e8475f'; g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); }
  const px = ox + (S.scene === 'world' ? P.x : G.x) * k, py = oy + (S.scene === 'world' ? P.y : G.y) * k;
  g.save(); g.translate(px, py); g.fillStyle = '#ffffff'; g.strokeStyle = OUT; g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, 7, 0, TAU); g.fill(); g.stroke(); drawPaw(g, 0, 0, 5, '#e8475f'); g.restore();
  g.font = '600 13px Fredoka, ui-rounded, sans-serif'; g.textAlign = 'left'; label('Paw: you   Ring: your goal   Red squares: big dungeons', 12, H - 12);
};

// ---- 11_net.js
// Accounts and cloud saves (a name and a password, no email). Only on the real site, where the API answers.
const API = 'https://dog-quest-api.muellercodes.workers.dev';
const Net = {
  enabled: /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname) || /[?&]net\b/.test(location.search),
  user: null, token: LS.get('dq_token', null), lastPush: 0, blocked: false, busy: false, msg: '', msgOk: false,
};
Net.call = async function (method, path, body) {
  const r = await fetch(API + path, { method, headers: Object.assign({ 'Content-Type': 'application/json' }, this.token ? { Authorization: 'Bearer ' + this.token } : {}), body: body ? JSON.stringify(body) : undefined });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error(j.error || 'Something went wrong. Try again.'); err.status = r.status; err.data = j; throw err; }
  return j;
};
Net.init = async function () {
  if (!this.enabled || !this.token) return;
  try { const j = await this.call('GET', '/api/me'); this.user = j.user; }
  catch (e) { if (e.status === 401 || e.status === 403) { this.token = null; LS.del('dq_token'); } }
  if (Game.state === 'title') UI.showTitle();
};
Net.signIn = async function (kind, name, pw) {
  this.busy = true; this.msg = '';
  try {
    const j = await this.call('POST', kind === 'new' ? '/api/register' : '/api/login', { username: name, password: pw });
    this.token = j.token; this.user = j.user; LS.set('dq_token', j.token);
    await this.mergeOnSignIn();
    this.msg = kind === 'new' ? 'Account made! Your journey now saves online.' : 'Welcome back, ' + j.user.name + '!'; this.msgOk = true;
  } catch (e) { this.msg = e.message; this.msgOk = false; }
  this.busy = false;
};
// after signing in, keep whichever journey has more play time
Net.mergeOnSignIn = async function () {
  let cloud = null;
  try { cloud = (await this.call('GET', '/api/save')).save; } catch (e) {}
  const local = Game.localSave();
  if (cloud && (!local || (cloud.t || 0) >= (local.t || 0))) { LS.set('dq_save', cloud); if (G && Game.state !== 'title') { Game.load(cloud); } }
  else if (local) { await this.push(true, local); }
  this.blocked = false;
};
Net.signOut = async function () {
  try { await this.call('POST', '/api/logout'); } catch (e) {}
  this.user = null; this.token = null; LS.del('dq_token');
  this.msg = 'Signed out. Your journey still saves on this device.'; this.msgOk = true;
};
Net.push = async function (force, data) {
  if (!this.user || this.blocked) return;
  const save = data || (G && G);
  if (!save) return;
  this.lastPush = Date.now();
  try {
    await this.call('PUT', '/api/save', { save, force: !!force });
    this.status = 'Saved online ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  } catch (e) {
    if (e.status === 409) {
      this.blocked = true;
      UI.toast('Your account has a journey with more play time from another device. Open Account in the menu to choose.', 'goal');
    } else if (e.status === 401) { this.user = null; this.token = null; LS.del('dq_token'); UI.toast('Signed out of your account. Your journey still saves here.'); }
    else this.status = 'Could not reach the server. Saved on this device.';
  }
};
Net.maybePush = function (force) {
  if (!this.user || this.blocked) return;
  if (force || Date.now() - this.lastPush > 25000) this.push(false);
};
Net.pullNewer = async function () {
  if (!this.user) return null;
  try { const j = await this.call('GET', '/api/save'); return j.save; } catch (e) { return null; }
};

  else UI.screen(`<div class="newgame paper">${this.formHtml(true)}</div>`, () => UI.showTitle());
};
Net.refresh = function () { if (Game.state === 'title' || (this.screenMode && !$('#screen').classList.contains('hidden'))) this.showAccountScreen(); else if (Game.state === 'menu') UI.renderMenu(); };
Net.click = function (b) {
  const act = b.dataset.act, val = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };
  switch (act) {
    case 'signIn': case 'signUp': { const n = val('acName').trim(), p = val('acPw'); this.signIn(act === 'signUp' ? 'new' : 'old', n, p).then(() => this.refresh()); this.msg = 'One moment...'; this.msgOk = true; this.refresh(); return true; }
    case 'signOut': this.signOut().then(() => this.refresh()); return true;
    case 'syncNow': this.push(false).then(() => this.refresh()); return true;
    case 'pwChange': { const o = val('pwOld'), n = val('pwNew'); this.call('POST', '/api/password', { old: o, password: n }).then(() => { this.msg = 'Password changed. Other devices were signed out.'; this.msgOk = true; }).catch((e) => { this.msg = e.message; this.msgOk = false; }).then(() => this.refresh()); return true; }
    case 'useLocal': this.blocked = false; this.push(true).then(() => { this.msg = 'Kept this journey. The other one was backed up.'; this.msgOk = true; this.refresh(); }); return true;
    case 'useCloud': this.pullNewer().then((s) => { if (s) { LS.set('dq_save', s); this.blocked = false; UI.closePanel(); Game.load(s); UI.toast('Loaded your other journey!', 'save'); } }); return true;
  }
  return false;
};
$('#screen').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) Net.click(b); });

// ---- 12_main.js
// The game loop: states, the camera, drawing order, saving and loading.
const Game = { state: 'boot', fading: false, saveT: 0, regionT: 0, region: null, sq: { x: 0, y: 0 } };
Game.canAct = function () { return this.state === 'play' && !this.fading && P.state !== 'dead'; };

Game.localSave = function () { const s = LS.get('dq_save', null); return s && s.game === 'dogquest' ? s : null; };
Game.save = function (force) {
  if (!G || this.state === 'title' || this.state === 'boot') return;
  if (S.scene === 'world') { G.x = P.x; G.y = P.y; }
  G.fog = Fog.save();
  G.saved = Date.now();
  G.lv = G.lv;
  LS.set('dq_save', G);
  Net.maybePush(force);
};
Game.migrate = function (s) {
  const d = newGame(s.hero ? s.hero.name : 'Biscuit', s.hero ? s.hero.breed : 'corgi', s.diff);
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  return s;
};
Game.load = function (data) {
  G = this.migrate(JSON.parse(JSON.stringify(data)));
  Fog.load(G.fog);
  S.scene = 'world'; S.dun = null; Dungeon.D = null;
  S.foes.length = 0; S.proj.length = 0; S.tele.length = 0; S.fx.length = 0; S.nums.length = 0; S.picks.length = 0; S.clouds.length = 0;
  for (const pk of Packs.list) { pk.alive = []; pk.spawned = 0; pk.cool = 0; }
  Bosses.current = null;
  P.x = G.x; P.y = G.y; P.state = 'idle'; P.inv = 1; P.hurt = 0; P.cds = {}; P.kbx = P.kby = 0;
  if (World.blocked(P.x, P.y, 10, !!G.flags.swim)) { const t = TOWNS[G.respawn] || TOWNS.waggington; P.x = t.x + 30; P.y = t.y + 70; }
  G.hp = clamp(G.hp, 1, maxHp());
  Cam.x = P.x; Cam.y = P.y; this.sq.x = P.x; this.sq.y = P.y - 50;
  this.region = null;
  this.state = 'play';
  UI.hideScreen();
  Music.play(this.regionMusic());
};
Game.continueGame = async function () {
  let s = this.localSave();
  if (Net.user) { const c = await Net.pullNewer(); if (c && (!s || (c.t || 0) > (s.t || 0))) { s = c; LS.set('dq_save', c); } }
  if (!s) return;
  this.fade(() => { this.load(s); if (G.main < MAIN.length && G.mainN === 0 && G.main === 0) Quests.begin(); else UI.toast('Welcome back, ' + G.hero.name + '!', 'save'); });
};
Game.startNew = function (name, breed, diff) {
  newGame(name, breed, diff);
  Fog.load('');
  UI.hideScreen();
  UI.showPrologue(() => {
    this.fade(() => {
      this.load(G);
      P.state = 'idle';
      LS.set('dq_save', G);
      if (Net.user) { Net.blocked = false; Net.push(true); }
      setTimeout(() => Quests.begin(), 600);
    });
  });
};
Game.toTitle = function () {
  this.save(true);
  S.foes.length = 0; S.tele.length = 0; S.proj.length = 0;
  if (S.scene === 'dungeon') { S.scene = 'world'; Dungeon.D = null; S.dun = null; }
  Bosses.current = null;
  UI.showTitle();
};
Game.fade = function (fn, text) {
  if (this.fading) return;
  this.fading = true;
  const f = $('#fade'); f.querySelector('.ft').textContent = text || '';
  f.classList.add('on');
  setTimeout(() => { try { fn(); } catch (e) { console.error(e); } setTimeout(() => { f.classList.remove('on'); this.fading = false; }, text ? 600 : 120); }, 320);
};
Game.regionMusic = function () {
  if (S.scene === 'dungeon') return 'dungeon';
  const t = World.townAt(P.x, P.y);
  if (t && t !== 'camp' && t !== 'landing') return 'town';
  const b = World.biomeAt(P.x, P.y);
  return { meadow: 'field', plains: 'field', forest: 'forest', coast: 'coast', snow: 'snow', desert: 'desert', spooky: 'spooky', isle: 'isle' }[b] || 'field';
};
Game.checkRegion = function (dt) {
  this.regionT -= dt; if (this.regionT > 0 || S.scene !== 'world') return;
  this.regionT = 0.5;
  const t = World.townAt(P.x, P.y), b = World.biomeAt(P.x, P.y);
  const key = t || b;
  if (key !== this.region) {
    const first = this.region == null;
    this.region = key;
    if (!first || true) UI.areaName(t ? TOWNS[t].name : BIOMES[b].name);
    Music.play(this.regionMusic());
  }
};

// coins and hearts on the ground
function updatePicks(dt) {
  for (let i = S.picks.length - 1; i >= 0; i--) {
    const p = S.picks[i];
    p.t += dt;
    if (p.t < p.delay) { p.x += p.vx * dt; p.z = Math.max(0, (p.z || 0) - p.vy * dt); p.vy += 600 * dt; if (p.z <= 0 && p.vy > 0) { p.vy = -p.vy * 0.3; } continue; }
    const a = angTo(p.x, p.y, P.x, P.y), d = dist(p.x, p.y, P.x, P.y), sp = 300 + p.t * 600;
    p.x += Math.cos(a) * Math.min(d, sp * dt); p.y += Math.sin(a) * Math.min(d, sp * dt); p.z = Math.max(0, (p.z || 0) - 200 * dt);
    if (d < 20) {
      S.picks.splice(i, 1);
      if (p.k === 'coin') { G.gold += p.val; Sfx.play('coin'); }
      else if (p.k === 'heart') { const h = Math.round(maxHp() * 0.15); G.hp = Math.min(maxHp(), G.hp + h); fxText(P.x, P.y - 50, '+' + h, '#7fe07a'); Sfx.play('belly'); }
    }
  }
}
function drawPick(c, p) {
  const y = p.y - (p.z || 0);
  if (p.k === 'coin') { c.save(); c.translate(p.x, y - 8); c.scale(Math.abs(Math.cos(p.t * 8)) * 0.7 + 0.3, 1); circ(c, 0, 0, 6); fo(c, '#ffd84d', 2); c.restore(); }
  else { c.fillStyle = '#ff6f8f'; c.save(); c.translate(p.x, y - 10); c.beginPath(); c.moveTo(0, 8); c.bezierCurveTo(-12, -2, -5, -11, 0, -3); c.bezierCurveTo(5, -11, 12, -2, 0, 8); c.fill(); c.lineWidth = 2; c.strokeStyle = OUT; c.stroke(); c.restore(); }
}

// ---------- the camera
function updateCamera(dt) {
  Cam.z = clamp(Math.min(SW, SH) / 560, 0.55, 2.6);
  let tx = P.x + Input.mx * 40, ty = P.y - 20 + Input.my * 30;
  if (Game.state === 'title') { Game.titleT = (Game.titleT || 0) + dt; tx = TOWNS.waggington.x + Math.cos(Game.titleT * 0.05) * 500; ty = TOWNS.waggington.y + Math.sin(Game.titleT * 0.04) * 300 - 60; }
  const k = Math.min(1, dt * 6);
  Cam.x += (tx - Cam.x) * k; Cam.y += (ty - Cam.y) * k;
  if (S.scene === 'dungeon' && Dungeon.D) {
    const R = Dungeon.room(), vw = SW / Cam.z, vh = SH / Cam.z;
    const inHall = P.x < R.x || P.x > R.x + R.w;
    if (!inHall) {
      Cam.x = R.w + 80 > vw ? clamp(Cam.x, R.x - 40 + vw / 2, R.x + R.w + 40 - vw / 2) : lerp(Cam.x, R.x + R.w / 2, k);
      Cam.y = R.h + 80 > vh ? clamp(Cam.y, R.y - 30 + vh / 2, R.y + R.h + 30 - vh / 2) : lerp(Cam.y, R.y + R.h / 2, k);
    }
  }
  if (S.scene === 'world') { const vw = SW / Cam.z / 2, vh = SH / Cam.z / 2; Cam.x = clamp(Cam.x, vw, WW - vw); Cam.y = clamp(Cam.y, vh, WH - vh); }
  Cam.shake = Math.max(0, Cam.shake - dt * 30);
}

// ---------- each frame
Game.update = function (dt) {
  S.time += dt;
  if (document.body.dataset.state !== this.state) document.body.dataset.state = this.state;
  switch (this.state) {
    case 'title': case 'story': case 'dead': updateNpcs(dt); Nav.update(); break;
    case 'dialog': Dialog.update(dt); updateFx(dt); break;
    case 'menu': case 'shop': Nav.update(); if (Input.hit.menu && Game.state === 'menu') UI.closePanel(); break;
    case 'play': {
      if (this.fading) break;
      if (Input.hit.menu) { UI.openMenu(); break; }
      if (Input.hit.map) { UI.openMenu('map'); break; }
      let wdt = dt * S.slowmo;
      if (S.hitstop > 0) { S.hitstop -= dt; wdt *= 0.08; }
      updateHero(wdt);
      updateFoes(wdt);
      updateTele(wdt);
      updateProj(wdt);
      updateFx(wdt);
      updatePicks(wdt);
      if (S.scene === 'world') { updateNpcs(wdt); Packs.update(wdt); Quests.checkGoto(); this.checkRegion(dt); }
      else Dungeon.update(wdt);
      Interact.find();
      UI.updateTouch();
      G.t += dt;
      this.saveT += dt;
      if (this.saveT > 30) { this.saveT = 0; this.save(); }
      break;
    }
  }
  updateCamera(dt);
};

Game.render = function (dt) {
  const c = ctx, t = S.time;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.imageSmoothingEnabled = true;
  const z = Cam.z * DPR, sx = (Math.random() - 0.5) * Cam.shake, sy = (Math.random() - 0.5) * Cam.shake;
  c.setTransform(z, 0, 0, z, Math.round((SW / 2 + sx - Cam.x * Cam.z) * DPR), Math.round((SH / 2 + sy - Cam.y * Cam.z) * DPR));
  c.lineJoin = 'round'; c.lineCap = 'round';
  const v = viewRect(60);
  const list = [];
  if (S.scene === 'world') {
    Ground.draw(c, t);
    // flat ground details
    for (let cy = Math.max(0, Math.floor(v.y0 / PC)); cy <= Math.min(PCH - 1, Math.floor(v.y1 / PC)); cy++) for (let cx = Math.max(0, Math.floor(v.x0 / PC)); cx <= Math.min(PCW - 1, Math.floor(v.x1 / PC)); cx++)
      for (const d of World.dgrid[cy * PCW + cx]) if (d.x > v.x0 && d.x < v.x1 && d.y > v.y0 && d.y < v.y1) drawSprite(c, decorSprite(d), d.x, d.y, 1);
    drawDocks(c, v);
    if (G) drawTreasure(c, v, t, list);
    // scenery
    const ps = World.propsIn(v.x0 - 150, v.y0 - 40, v.x1 + 150, v.y1 + 260, []);
    for (const p of ps) list.push({ y: p.y, p });
  } else Dungeon.drawFloor(c, t);
  if (Game.state !== 'title' && G) {
    drawTele(c);
    // soft shadows under everyone
    c.fillStyle = 'rgba(40,25,60,0.2)';
    if (P.state !== 'dig') { ell(c, P.x, P.y, 15, 5); c.fill(); }
    for (const f of S.foes) if (!f.gone) { ell(c, f.x, f.y, f.r * 1.05, f.r * 0.38); c.fill(); }
    for (const n of S.npcs) if (S.scene === 'world' && n.x > v.x0 && n.x < v.x1 && n.y > v.y0 && n.y < v.y1 + 40) { ell(c, n.x, n.y, 15 * ((BREEDS[n.def.breed] || {}).size || 1), 5); c.fill(); }
    list.push({ y: P.y, hero: 1 });
    for (const f of S.foes) if (!f.gone) list.push({ y: f.y, f });
    for (const p of S.proj) list.push({ y: p.y + (p.lob ? 1000 : 0), pr: p });
    for (const p of S.picks) list.push({ y: p.y, pk: p });
    if (S.scene === 'dungeon') Dungeon.sprites(list);
  }
  if (S.scene === 'world') for (const n of S.npcs) if (n.x > v.x0 - 40 && n.x < v.x1 + 40 && n.y > v.y0 - 40 && n.y < v.y1 + 120) list.push({ y: n.y, n });
  list.sort((a, b) => a.y - b.y);
  for (const it of list) {
    if (it.p) drawProp(c, it.p);
    else if (it.hero) drawHero(c);
    else if (it.f) drawFoe(c, it.f);
    else if (it.n) drawNpc(c, it.n);
    else if (it.pr) drawProj(c, it.pr);
    else if (it.pk) drawPick(c, it.pk);
    else if (it.draw) it.draw(c);
  }
  if (Game.state !== 'title' && G) {
    // Squeaky floats along behind the hero
    const sq = this.sq, k = Math.min(1, dt * 4);
    sq.x += (P.x - P.face * 30 - sq.x) * k; sq.y += (P.y - 58 - sq.y) * k;
    if (P.state !== 'dead') drawSqueaky(c, sq.x, sq.y, t, Dialog.open && Dialog.speaker === 'squeaky');
    for (const f of S.foes) if (!f.gone) drawFoeBar(c, f);
    drawFx(c);
    drawNums(c);
    drawPointer(c);
    drawPrompt(c);
  }
  if (S.scene === 'world') Clouds.draw(c, dt);
  if (Game.state !== 'title' && Game.state !== 'boot' && G && this.state !== 'story') HUD.draw(c);
};
function drawProp(c, p) {
  if (p.gone) return;
  if (p.kind === 'bld') {
    const s = bldSprite(p), d = BLD[p.bk];
    const hide = P.y < p.y - 8 && P.y > p.y - d.oy * 0.9 && Math.abs(P.x - p.x) < d.w * 0.42 && Game.state !== 'title';
    if (hide) c.globalAlpha = 0.55;
    drawSprite(c, s, p.x, p.y, 1);
    c.globalAlpha = 1;
    return;
  }
  if (!p.b) p.b = World.biomeAt(p.x, p.y);
  const s = propSprite(p, p.b);
  const tall = s.oy * p.s;
  const hide = Game.state !== 'title' && tall > 50 && P.y < p.y - 6 && P.y > p.y - tall * 0.95 && Math.abs(P.x - p.x) < s.w * p.s * 0.38;
  if (hide) c.globalAlpha = 0.5;
  drawSprite(c, s, p.x, p.y, p.s);
  c.globalAlpha = 1;
}
function drawDocks(c, v) {
  for (const dk of [World.dock, World.dock2]) {
    if (!dk || dk.x < v.x0 - 300 || dk.x > v.x1 + 300 || dk.y < v.y0 - 100 || dk.y > v.y1 + 100) continue;
    const dir = dk.to === 'isle' ? 1 : -1;
    c.fillStyle = '#b88752'; c.strokeStyle = OUT; c.lineWidth = 2.5;
    c.beginPath(); rrect(c, dir > 0 ? dk.x - 20 : dk.x - 150, dk.y - 18, 170, 36, 6); c.fill(); c.stroke();
    c.strokeStyle = '#94683d'; c.lineWidth = 1.6;
    for (let i = 0; i < 9; i++) { const x = (dir > 0 ? dk.x - 20 : dk.x - 150) + 10 + i * 18; c.beginPath(); c.moveTo(x, dk.y - 16); c.lineTo(x, dk.y + 16); c.stroke(); }
  }
}

// ---------- start up
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  try {
    Input.update();
    Game.update(dt);
    Game.render(dt);
  } catch (e) { console.error(e); if (!Game.errShown) { Game.errShown = 1; UI.toast('Oops, something went wrong: ' + e.message); } }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && G && Game.state !== 'title') Game.save(true); });
window.addEventListener('pagehide', () => { if (G && Game.state !== 'title') Game.save(true); });
function boot() {
  World.init();
  World.placeTreasure();
  Clouds.init();
  Packs.init();
  makeNpcs();
  Cam.x = TOWNS.waggington.x; Cam.y = TOWNS.waggington.y; Cam.z = clamp(Math.min(SW, SH) / 560, 0.55, 2.6);
  UI.applyTouchSetting();
  if (matchMedia('(pointer: coarse)').matches) { document.body.classList.add('touchy'); Input.mode = 'touch'; }
  UI.showTitle();
  Net.init();
  requestAnimationFrame(frame);
}
Object.defineProperty(DQ, 'G', { get() { return G; }, set(v) { G = v; } });
Object.assign(DQ, { P, S, Cam, World, Game, Quests, Dungeon, Bosses, UI, Dialog, Input, Interact, Net, Packs, Fog, TOWNS, MAIN, SIDE, BOUNTIES, NPCS, DUNGEON_SPOTS, makeFoe, addFoe, giveItem, giveXp, heroHurt, useTrick, heroSwing, MapView, Music, maxHp, Nav });
// wait for the font so canvas text looks right, but never longer than a moment
(document.fonts && document.fonts.load ? Promise.race([document.fonts.load('700 20px Fredoka'), new Promise((r) => setTimeout(r, 1500))]) : Promise.resolve()).then(boot, boot);
